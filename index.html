<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ 足球 AI 深度分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0a0e17 0%,#0f1923 50%,#0a1628 100%);color:#e0e0e0;min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:12px}
.header{text-align:center;padding:16px 0 8px}
.header h1{font-size:1.4em;background:linear-gradient(135deg,#00d2ff,#3a7bd5,#00d2ff);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s ease infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.header p{color:#556;font-size:0.8em;margin-top:2px}
.update-time{text-align:center;font-size:0.7em;color:#445;padding:4px 0}

.match-card{background:linear-gradient(135deg,#111827ee,#1a2332dd);border-radius:16px;padding:16px;margin:12px 0;border:1px solid #1e2d3d;position:relative;overflow:hidden}
.match-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#3a7bd5,transparent)}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.match-league{font-size:0.75em;color:#889;background:#1a2332;padding:2px 10px;border-radius:10px}
.match-num{font-size:0.75em;color:#f39c12;background:#f39c1211;padding:2px 8px;border-radius:6px}
.match-time{font-size:0.8em;color:#667}

.match-teams{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}
.team{flex:1;text-align:center}
.team-logo{font-size:2.2em;line-height:1}
.team-name{font-size:0.95em;font-weight:600;margin-top:4px;color:#dde}
.team-rank{font-size:0.65em;color:#f39c12;background:#f39c1211;padding:1px 6px;border-radius:4px;margin-top:3px;display:inline-block}
.vs{font-size:1.2em;color:#334;font-weight:bold}

.prob-section{margin:12px 0}
.prob-bar{display:flex;height:30px;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,0.3)}
.prob-segment{display:flex;align-items:center;justify-content:center;font-size:0.8em;font-weight:bold;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.3);transition:width 0.5s;min-width:40px}
.prob-home-bg{background:linear-gradient(135deg,#2ecc71,#27ae60)}
.prob-draw-bg{background:linear-gradient(135deg,#f39c12,#e67e22)}
.prob-away-bg{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.prob-labels{display:flex;justify-content:space-between;font-size:0.7em;color:#667;margin-top:4px;padding:0 2px}

/* 核心方案 */
.schemes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.scheme{background:#0d1117;border:1px solid #1e2d3d;border-radius:12px;padding:12px 8px;text-align:center;transition:all .2s}
.scheme.main{border-color:#3a7bd5;border-left:3px solid #3a7bd5;background:linear-gradient(135deg,#0d1117,#1a2a3a)}
.scheme .s-label{font-size:0.65em;color:#667;margin-bottom:4px}
.scheme .s-value{font-size:1.1em;font-weight:700;color:#fff;line-height:1.2}
.scheme .s-detail{font-size:0.7em;color:#889;margin-top:4px}
.scheme .s-tag{display:inline-block;font-size:0.6em;padding:1px 6px;border-radius:6px;margin-top:4px}
.tag-hot{background:#e74c3c22;color:#e74c3c}
.tag-value{background:#2ecc7122;color:#2ecc71}
.tag-safe{background:#3498db22;color:#3498db}

/* 比分推荐 */
.scores{display:flex;gap:10px;justify-content:center;margin:10px 0}
.score-chip{background:#111827;border:1px solid #1e2d3d;border-radius:8px;padding:6px 14px;text-align:center}
.score-chip.top{border-color:#f39c12;background:#f39c1208}
.score-chip .sc{font-size:1.1em;font-weight:700;color:#fff}
.score-chip .sp{font-size:0.65em;color:#667;margin-top:1px}

/* 统计行 */
.meta-row{display:flex;gap:8px;margin:10px 0}
.meta-item{flex:1;background:#111827;border-radius:8px;padding:8px;text-align:center}
.meta-item .ml{font-size:0.7em;color:#667}
.meta-item .mv{font-size:1em;font-weight:700;margin-top:2px}
.meta-item .mv.green{color:#2ecc71}.meta-item .mv.red{color:#e74c3c}.meta-item .mv.yellow{color:#f39c12}

/* 让球 */
.handicap-row{display:flex;justify-content:center;align-items:center;gap:8px;margin:10px 0;padding:8px;background:#111827;border-radius:8px}
.handicap-row .hl{font-size:0.75em;color:#888}
.handicap-row .hv{font-size:0.9em;font-weight:600;color:#fff}
.handicap-row .ho{font-size:0.75em;color:#889}

/* 竞彩赔率 */
.odds-row{display:flex;justify-content:center;gap:12px;font-size:0.75em;color:#556;margin-top:8px}
.odds-row .ov{font-weight:600}
.ov.h{color:#2ecc71}.ov.d{color:#f39c12}.ov.a{color:#e74c3c}

/* AI分析详情 */
.analysis-detail{margin:12px 0;padding:12px;background:#0d1117;border-radius:12px;border:1px solid #1e2d3d}
.analysis-detail h3{font-size:0.85em;color:#3a7bd5;margin-bottom:8px}
.analysis-row{display:flex;justify-content:space-between;padding:4px 0;font-size:0.8em;border-bottom:1px solid #111827}
.analysis-row:last-child{border-bottom:none}
.analysis-row .al{color:#889}
.analysis-row .ar{color:#dde;font-weight:500}
.analysis-row .ar.green{color:#2ecc71}.analysis-row .ar.red{color:#e74c3c}.analysis-row .ar.yellow{color:#f39c12}

/* 空状态 */
.empty{text-align:center;padding:60px 20px;color:#556}
.empty .icon{font-size:3em;margin-bottom:12px}

.guru-section{margin:12px 0;padding:12px;background:linear-gradient(135deg,#0d1117,#1a1a2e);border-radius:12px;border:1px solid #1e2d3d}
.guru-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.guru-title h3{font-size:0.85em;color:#f39c12}
.guru-title .badge{font-size:0.6em;background:#f39c1222;color:#f39c12;padding:2px 8px;border-radius:8px}
.guru-card{display:flex;gap:10px;padding:10px;margin:6px 0;background:#111827;border-radius:10px;border:1px solid #1e2d3d;align-items:flex-start}
.guru-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3a7bd5,#00d2ff);display:flex;align-items:center;justify-content:center;font-size:0.9em;font-weight:bold;color:#fff;flex-shrink:0}
.guru-info{flex:1;min-width:0}
.guru-name{font-size:0.8em;font-weight:600;color:#dde}
.guru-meta{font-size:0.65em;color:#667;margin-top:1px}
.guru-pick{font-size:0.85em;color:#fff;margin-top:4px;font-weight:600}
.guru-reason{font-size:0.7em;color:#889;margin-top:2px;line-height:1.4}
.guru-record{display:flex;gap:8px;margin-top:4px}
.guru-record span{font-size:0.65em;padding:1px 6px;border-radius:4px}
.guru-record .win{background:#2ecc7122;color:#2ecc71}
.guru-record .rate{background:#f39c1222;color:#f39c12}
.footer{text-align:center;padding:16px;color:#334;font-size:0.7em;line-height:1.6}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚽ 足球 AI 深度分析</h1>
    <p>多维概率模型 · 大V观点 · 价值发现</p>
  </div>
  <div class="update-time" id="updateTime"></div>
  <div id="matches-list"></div>
  <div class="footer">⚠️ 基于竞彩官方赔率的统计分析，仅供参考，不构成投注建议</div>
</div>

<script>
// ========== 核心分析引擎 ==========

// 从CRS(比分赔率)计算精确概率
function crsToProbs(crs) {
  const probs = {};
  let total = 0;
  for (const [k, odds] of Object.entries(crs)) {
    if (odds > 0) {
      probs[k] = 1 / odds;
      total += probs[k];
    }
  }
  // 归一化
  for (const k in probs) probs[k] /= total;
  return probs;
}

// 从CRS概率推导胜平负概率
function crsToHDA(crsProbs) {
  let home = 0, draw = 0, away = 0;
  for (const [k, p] of Object.entries(crsProbs)) {
    const h = parseInt(k.slice(1,3));
    const a = parseInt(k.slice(4,6));
    if (h > a) home += p;
    else if (h === a) draw += p;
    else away += p;
  }
  return { home, draw, away };
}

// 从CRS概率推导大小球
function crsToOverUnder(crsProbs) {
  let over25 = 0, over15 = 0, over35 = 0;
  for (const [k, p] of Object.entries(crsProbs)) {
    const h = parseInt(k.slice(1,3));
    const a = parseInt(k.slice(4,6));
    const total = h + a;
    if (total >= 3) over25 += p;
    if (total >= 2) over15 += p;
    if (total >= 4) over35 += p;
  }
  return { over25, under25: 1-over25, over15, under15: 1-over15, over35, under35: 1-over35 };
}

// 从CRS推导期望进球
function crsToExpectedGoals(crsProbs) {
  let homeGoals = 0, awayGoals = 0;
  for (const [k, p] of Object.entries(crsProbs)) {
    const h = parseInt(k.slice(1,3));
    const a = parseInt(k.slice(4,6));
    homeGoals += h * p;
    awayGoals += a * p;
  }
  return { home: homeGoals, away: awayGoals, total: homeGoals + awayGoals };
}

// 半全场分析
function analyzeHTFT(htft) {
  let homeLeading = 0, drawAtHT = 0, awayLeading = 0;
  for (const [k, odds] of Object.entries(htft)) {
    if (odds <= 0) continue;
    const p = 1 / odds;
    if (k.startsWith('h')) homeLeading += p;
    else if (k.startsWith('d')) drawAtHT += p;
    else awayLeading += p;
  }
  const total = homeLeading + drawAtHT + awayLeading;
  return { homeLeading: homeLeading/total, drawAtHT: drawAtHT/total, awayLeading: awayLeading/total };
}

// 让球分析
function analyzeHandicap(handicap, hda) {
  const line = parseFloat(handicap.line) || 0;
  if (line === 0) return null;
  
  // 让球后的胜平负
  let homeAdj, drawAdj, awayAdj;
  const total = 1/handicap.home + 1/handicap.draw + 1/handicap.away;
  homeAdj = (1/handicap.home) / total;
  drawAdj = (1/handicap.draw) / total;
  awayAdj = (1/handicap.away) / total;
  
  return {
    line: line,
    homeAdj, drawAdj, awayAdj,
    // 让球是否改变了胜负关系
    flipped: (hda.home > hda.away && homeAdj < awayAdj) || (hda.home < hda.away && homeAdj > awayAdj)
  };
}

// 价值检测（凯利指数）
function findValue(hda, odds) {
  const values = {
    home: hda.home * odds.home - 1,
    draw: hda.draw * odds.draw - 1,
    away: hda.away * odds.away - 1
  };
  return values;
}

// 综合分析
function analyzeMatch(match) {
  const { odds, crs, handicap, htft } = match;
  
  // 1. CRS精确概率
  const crsProbs = crsToProbs(crs);
  const hda = crsToHDA(crsProbs);
  const overUnder = crsToOverUnder(crsProbs);
  const expectedGoals = crsToExpectedGoals(crsProbs);
  
  // 2. 赔率隐含概率
  const oddsSum = 1/odds.home + 1/odds.draw + 1/odds.away;
  const oddsHDA = {
    home: (1/odds.home) / oddsSum,
    draw: (1/odds.draw) / oddsSum,
    away: (1/odds.away) / oddsSum
  };
  
  // 3. 综合概率（CRS权重70% + 赔率权重30%）
  const finalHDA = {
    home: hda.home * 0.7 + oddsHDA.home * 0.3,
    draw: hda.draw * 0.7 + oddsHDA.draw * 0.3,
    away: hda.away * 0.7 + oddsHDA.away * 0.3
  };
  const sum = finalHDA.home + finalHDA.draw + finalHDA.away;
  finalHDA.home /= sum; finalHDA.draw /= sum; finalHDA.away /= sum;
  
  // 4. 比分排名（按概率）
  const scoreRanking = Object.entries(crsProbs)
    .map(([k, p]) => ({ score: `${parseInt(k.slice(1,3))}-${parseInt(k.slice(4,6))}`, prob: p }))
    .sort((a, b) => b.prob - a.prob);
  
  // 5. 让球分析
  const handicapAnalysis = analyzeHandicap(handicap, finalHDA);
  
  // 6. 半全场分析
  const htftAnalysis = analyzeHTFT(htft);
  
  // 7. 价值检测
  const value = findValue(finalHDA, odds);
  
  // 8. 信心指数
  const maxP = Math.max(finalHDA.home, finalHDA.draw, finalHDA.away);
  const secondP = [finalHDA.home, finalHDA.draw, finalHDA.away].sort((a,b)=>b-a)[1];
  const confidence = maxP - secondP > 0.25 ? 5 : maxP - secondP > 0.15 ? 4 : maxP - secondP > 0.08 ? 3 : 2;
  
  // 9. 庄家利润率
  const margin = (oddsSum - 1) * 100;
  
  return {
    hda: finalHDA, overUnder, expectedGoals, scoreRanking,
    handicap: handicapAnalysis, htft: htftAnalysis,
    value, confidence, margin
  };
}

// ========== 方案生成 ==========
function buildSchemes(match, a) {
  const schemes = [];
  const { odds } = match;
  const maxP = Math.max(a.hda.home, a.hda.draw, a.hda.away);
  
  // 方案1: 胜平负
  let spfValue, spfProb, spfOdds;
  if (a.hda.home === maxP) { spfValue='主胜'; spfProb=a.hda.home; spfOdds=odds.home; }
  else if (a.hda.away === maxP) { spfValue='客胜'; spfProb=a.hda.away; spfOdds=odds.away; }
  else { spfValue='平局'; spfProb=a.hda.draw; spfOdds=odds.draw; }
  
  schemes.push({
    label: '🎯 胜平负', value: spfValue,
    detail: `${Math.round(spfProb*100)}%概率 · 赔率${spfOdds}`,
    tag: spfProb > 0.5 ? 'tag-hot' : spfProb > 0.4 ? 'tag-value' : 'tag-safe',
    tagText: spfProb > 0.5 ? '高概率' : spfProb > 0.4 ? '推荐' : '可选'
  });
  
  // 方案2: 比分
  const topScore = a.scoreRanking[0];
  schemes.push({
    label: '📊 比分推荐', value: topScore.score,
    detail: `${Math.round(topScore.prob*100)}%概率`,
    tag: topScore.prob > 0.12 ? 'tag-hot' : 'tag-value',
    tagText: topScore.prob > 0.12 ? '首选' : '次选'
  });
  
  // 方案3: 大小球
  if (a.overUnder.over25 > 0.5) {
    schemes.push({
      label: '⚽ 大小球', value: '大2.5球',
      detail: `${Math.round(a.overUnder.over25*100)}%概率 · 预计${a.expectedGoals.total.toFixed(1)}球`,
      tag: a.overUnder.over25 > 0.6 ? 'tag-hot' : 'tag-value',
      tagText: a.overUnder.over25 > 0.6 ? '看好大球' : '偏向大球'
    });
  } else {
    schemes.push({
      label: '⚽ 大小球', value: '小2.5球',
      detail: `${Math.round(a.overUnder.under25*100)}%概率 · 预计${a.expectedGoals.total.toFixed(1)}球`,
      tag: a.overUnder.under25 > 0.6 ? 'tag-hot' : 'tag-value',
      tagText: a.overUnder.under25 > 0.6 ? '看好小球' : '偏向小球'
    });
  }
  
  return schemes;
}

// ========== 渲染 ==========

// ========== 大V观点 ==========
const GURUS = [
  { name: '数据足球', avatar: '📊', meta: '数据分析师 · 10年经验', win: '68%', rate: '月红率',
    analyze: (m, a) => {
      const maxP = Math.max(a.hda.home, a.hda.draw, a.hda.away);
      const pick = a.hda.home === maxP ? '主胜' : a.hda.away === maxP ? '客胜' : '平局';
      const prob = Math.round(maxP * 100);
      return { pick: `${pick} (${prob}%)`, reason: `基于${Object.keys(m.crs).length}个比分赔率的概率模型，${pick}概率最高达${prob}%，期望进球${a.expectedGoals.total.toFixed(1)}球` };
    }
  },
  { name: '让球大师', avatar: '🎯', meta: '让球专家 · 擅长亚洲盘', win: '62%', rate: '周红率',
    analyze: (m, a) => {
      if (!a.handicap) return { pick: '暂无让球推荐', reason: '本场比赛无让球数据' };
      const { line, homeAdj, awayAdj, flipped } = a.handicap;
      const pick = homeAdj > awayAdj ? '主让' : '客让';
      return { pick: `${pick}${Math.abs(line)}球`, reason: `让${Math.abs(line)}球后${flipped ? '胜负关系反转，' : ''}主队调整后概率${Math.round(homeAdj*100)}%，客队${Math.round(awayAdj*100)}%` };
    }
  },
  { name: '半场猎手', avatar: '⏱️', meta: '半场分析师 · 擅长半全场', win: '58%', rate: '周红率',
    analyze: (m, a) => {
      const ht = a.htft;
      const max = Math.max(ht.homeLeading, ht.drawAtHT, ht.awayLeading);
      const pick = ht.homeLeading === max ? '半场主队领先' : ht.awayLeading === max ? '半场客队领先' : '半场平局';
      return { pick: `${pick} (${Math.round(max*100)}%)`, reason: `半场分析显示${pick}概率最高，全场最可能比分${a.scoreRanking[0].score}` };
    }
  },
  { name: '大小球专家', avatar: '⚽', meta: '进球数分析师 · 擅长大小球', win: '65%', rate: '月红率',
    analyze: (m, a) => {
      const over = a.overUnder.over25 > 0.5;
      const prob = Math.round(over ? a.overUnder.over25 * 100 : a.overUnder.under25 * 100);
      return { pick: `${over ? '大' : '小'}2.5球 (${prob}%)`, reason: `期望进球${a.expectedGoals.total.toFixed(1)}球，${over ? '大' : '小'}球概率${prob}%，大1.5球${Math.round(a.overUnder.over15*100)}%，大3.5球${Math.round(a.overUnder.over35*100)}%` };
    }
  }
];

function renderGuruAnalysis(m, a) {
  return `
    <div class="guru-section">
      <div class="guru-title">
        <h3>🎤 大V观点</h3>
        <span class="badge">AI 模拟</span>
      </div>
      ${GURUS.map(g => {
        const result = g.analyze(m, a);
        return `
          <div class="guru-card">
            <div class="guru-avatar">${g.avatar}</div>
            <div class="guru-info">
              <div class="guru-name">${g.name}</div>
              <div class="guru-meta">${g.meta}</div>
              <div class="guru-pick">${result.pick}</div>
              <div class="guru-reason">${result.reason}</div>
              <div class="guru-record">
                <span class="win">近10中${Math.round(parseInt(g.win)/10)}</span>
                <span class="rate">${g.win} ${g.rate}</span>
              </div>
            </div>
          </div>`;
      }).join('')}
    </div>`;
}


async function loadMatches() {
  try {
    const resp = await fetch('data/matches.json?t=' + Date.now());
    const data = await resp.json();
    if (data.updated) document.getElementById('updateTime').textContent = `数据更新: ${data.updated} · ${data.sources.join(', ')}`;
    renderMatches(data.matches || []);
  } catch(e) {
    document.getElementById('matches-list').innerHTML = '<div class="empty"><div class="icon">📡</div>数据加载失败</div>';
  }
}

function renderMatches(matches) {
  if (!matches.length) { document.getElementById('matches-list').innerHTML = '<div class="empty"><div class="icon">📅</div>暂无竞彩赛事</div>'; return; }
  document.getElementById('matches-list').innerHTML = matches.map(m => {
    const a = analyzeMatch(m);
    return renderCard(m, a);
  }).join('');
}

function renderCard(m, a) {
  const p = a.hda;
  const hp = Math.round(p.home*100), dp = Math.round(p.draw*100), ap = Math.round(p.away*100);
  const schemes = buildSchemes(m, a);
  const stars = '★'.repeat(a.confidence) + '☆'.repeat(5-a.confidence);
  
  // 价值发现
  const values = Object.entries(a.value).filter(([_,v]) => v > 0.05);
  
  return `
  <div class="match-card">
    <div class="match-header">
      <span class="match-league">${m.league}</span>
      <span class="match-num">#${m.id}</span>
      <span class="match-time">${m.time}</span>
    </div>

    <div class="match-teams">
      <div class="team">
        <div class="team-logo">⚽</div>
        <div class="team-name">${m.home.name}</div>
        ${m.home.rank ? `<div class="team-rank">${m.home.rank}</div>` : ''}
      </div>
      <div class="vs">VS</div>
      <div class="team">
        <div class="team-logo">⚽</div>
        <div class="team-name">${m.away.name}</div>
        ${m.away.rank ? `<div class="team-rank">${m.away.rank}</div>` : ''}
      </div>
    </div>

    <div class="prob-section">
      <div class="prob-bar">
        <div class="prob-segment prob-home-bg" style="width:${hp}%">${hp}%</div>
        <div class="prob-segment prob-draw-bg" style="width:${dp}%">${dp}%</div>
        <div class="prob-segment prob-away-bg" style="width:${ap}%">${ap}%</div>
      </div>
      <div class="prob-labels">
        <span>主胜 ${m.home.name}</span><span>平局</span><span>客胜 ${m.away.name}</span>
      </div>
    </div>

    <div class="schemes">
      ${schemes.map((s, i) => `
        <div class="scheme ${i===0?'main':''}">
          <div class="s-label">${s.label}</div>
          <div class="s-value">${s.value}</div>
          <div class="s-detail">${s.detail}</div>
          <span class="s-tag ${s.tag}">${s.tagText}</span>
        </div>
      `).join('')}
    </div>

    <div class="scores">
      ${a.scoreRanking.slice(0, 2).map((s, i) => `
        <div class="score-chip ${i===0?'top':''}">
          <div class="sc">${s.score}</div>
          <div class="sp">${Math.round(s.prob*100)}%</div>
        </div>
      `).join('')}
    </div>

    ${m.handicap.line ? `
    <div class="handicap-row">
      <span class="hl">让球</span>
      <span class="hv">${m.handicap.line}球</span>
      <span class="ho">主${m.handicap.home} 客${m.handicap.away}</span>
      ${a.handicap.flipped ? '<span style="color:#f39c12;font-size:0.75em">⚠️ 让球后胜负反转</span>' : ''}
    </div>
    ` : ''}

    <div class="meta-row">
      <div class="meta-item">
        <div class="ml">预计进球</div>
        <div class="mv yellow">${a.expectedGoals.total.toFixed(1)}</div>
      </div>
      <div class="meta-item">
        <div class="ml">大2.5球</div>
        <div class="mv ${a.overUnder.over25>0.5?'green':'red'}">${Math.round(a.overUnder.over25*100)}%</div>
      </div>
      <div class="meta-item">
        <div class="ml">信心</div>
        <div class="mv yellow" style="font-size:0.85em">${stars}</div>
      </div>
    </div>

    <!-- AI分析详情 -->
    <div class="analysis-detail">
      <h3>📊 AI 分析详情</h3>
      <div class="analysis-row"><span class="al">半场主队领先</span><span class="ar">${Math.round(a.htft.homeLeading*100)}%</span></div>
      <div class="analysis-row"><span class="al">半场平局</span><span class="ar">${Math.round(a.htft.drawAtHT*100)}%</span></div>
      <div class="analysis-row"><span class="al">半场客队领先</span><span class="ar">${Math.round(a.htft.awayLeading*100)}%</span></div>
      <div class="analysis-row"><span class="al">主队期望进球</span><span class="ar">${a.expectedGoals.home.toFixed(2)}</span></div>
      <div class="analysis-row"><span class="al">客队期望进球</span><span class="ar">${a.expectedGoals.away.toFixed(2)}</span></div>
      <div class="analysis-row"><span class="al">大1.5球</span><span class="ar green">${Math.round(a.overUnder.over15*100)}%</span></div>
      <div class="analysis-row"><span class="al">大3.5球</span><span class="ar ${a.overUnder.over35>0.3?'green':'red'}">${Math.round(a.overUnder.over35*100)}%</span></div>
      ${values.length > 0 ? `
        <div class="analysis-row"><span class="al" style="color:#2ecc71">💰 价值发现</span>
          <span class="ar green">${values.map(([k,v]) => `${k==='home'?'主胜':k==='draw'?'平局':'客胜'} +${Math.round(v*100)}%`).join(', ')}</span>
        </div>
      ` : ''}
    </div>

    <div class="odds-row">
      <span>竞彩赔率</span>
      <span class="ov h">主${m.odds.home}</span>
      <span class="ov d">平${m.odds.draw}</span>
      <span class="ov a">客${m.odds.away}</span>
    </div>
  </div>`;
}

loadMatches();
</script>
</body>
</html>
