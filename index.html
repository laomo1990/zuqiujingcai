<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ 足球AI分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','SF Pro Display','Microsoft YaHei',sans-serif;background:#050810;color:#e8eaed;min-height:100vh;overflow-x:hidden}

/* 粒子画布 */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:16px 12px;min-height:100vh}

/* 头部 */
.hero{text-align:center;padding:32px 0 24px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:20px;background:rgba(46,204,113,.08);border:1px solid rgba(46,204,113,.15);font-size:.7em;color:#2ecc71;margin-bottom:12px;backdrop-filter:blur(10px)}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:#2ecc71;animation:glow 2s ease infinite;box-shadow:0 0 8px #2ecc71}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{font-size:1.8em;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#fff 0%,#a0aec0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,#2ecc71,#00d2ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#4a5568;font-size:.85em;margin-top:8px;letter-spacing:.02em}

/* 统计条 */
.stats{display:flex;gap:8px;margin:0 0 20px}
.stat{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px;text-align:center;backdrop-filter:blur(10px)}
.stat .n{font-size:1.4em;font-weight:700;color:#fff}
.stat .l{font-size:.65em;color:#4a5568;margin-top:2px}

/* 筛选 */
.pills{display:flex;gap:6px;overflow-x:auto;padding:0 0 16px;scrollbar-width:none;-ms-overflow-style:none}
.pills::-webkit-scrollbar{display:none}
.pill{padding:6px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.08);background:transparent;color:#718096;font-size:.8em;cursor:pointer;white-space:nowrap;transition:all .25s;backdrop-filter:blur(10px)}
.pill:hover{border-color:rgba(46,204,113,.3);color:#a0aec0}
.pill.on{background:linear-gradient(135deg,rgba(46,204,113,.15),rgba(0,210,255,.1));border-color:rgba(46,204,113,.4);color:#2ecc71;font-weight:600}

/* 赛事卡片 */
.card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:20px;margin:0 0 16px;overflow:hidden;backdrop-filter:blur(20px);position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(46,204,113,.3),transparent)}

.card-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.04)}
.card-league{font-size:.75em;color:#4a5568;font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.card-time{font-size:.75em;color:#f39c12;display:flex;align-items:center;gap:6px}
.card-time .live{width:5px;height:5px;border-radius:50%;background:#2ecc71;animation:glow 2s ease infinite;box-shadow:0 0 6px #2ecc71}

/* 队伍 */
.teams{padding:24px 18px;display:flex;align-items:center;justify-content:center;gap:20px;position:relative}
.teams::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border:1px solid rgba(255,255,255,.04);border-radius:50%}
.team{text-align:center;flex:1}
.crest{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1.5px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:1.6em;transition:all .3s}
.crest:hover{border-color:rgba(46,204,113,.4);box-shadow:0 0 20px rgba(46,204,113,.15)}
.t-name{font-size:.95em;font-weight:600;color:#e8eaed;margin-top:8px;letter-spacing:.01em}
.t-rank{font-size:.6em;color:#f39c12;background:rgba(243,156,18,.08);padding:2px 8px;border-radius:8px;margin-top:4px;display:inline-block}
.vs{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:.75em;font-weight:700;color:#4a5568}

/* 概率条 */
.prob{margin:0 18px 18px;padding:16px;background:linear-gradient(135deg,rgba(46,204,113,.04),rgba(0,210,255,.02));border-radius:14px;border:1px solid rgba(46,204,113,.08)}
.prob-bar{display:flex;height:36px;border-radius:10px;overflow:hidden;gap:3px;margin-bottom:10px;box-shadow:inset 0 2px 8px rgba(0,0,0,.3)}
.seg{display:flex;align-items:center;justify-content:center;font-size:.85em;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4);border-radius:8px;transition:width .6s ease}
.seg-h{background:linear-gradient(180deg,#3a9d5d,#2ecc71,#27ae60)}
.seg-d{background:linear-gradient(180deg,#d4a017,#f39c12,#e67e22)}
.seg-a{background:linear-gradient(180deg,#c0392b,#e74c3c,#d63031)}
.prob-labels{display:flex;justify-content:space-between;font-size:.7em;color:#4a5568;font-weight:500}

/* 推荐方案 */
.rec{margin:0 18px 18px}
.rec-card{background:rgba(46,204,113,.06);border:1px solid rgba(46,204,113,.15);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.rec-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:linear-gradient(180deg,#2ecc71,#00d2ff)}
.rec-label{font-size:.7em;color:#4a5568;margin-bottom:4px;letter-spacing:.05em;text-transform:uppercase}
.rec-value{font-size:1.6em;font-weight:800;color:#fff;letter-spacing:-.02em}
.rec-meta{display:flex;gap:12px;margin-top:8px}
.rec-meta span{font-size:.75em;color:#718096}
.rec-meta .green{color:#2ecc71}
.rec-meta .yellow{color:#f39c12}
.rec-stars{color:#f39c12;font-size:.85em;letter-spacing:2px}

/* 比分 */
.scores{display:flex;gap:10px;margin:0 18px 18px}
.score{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px;text-align:center;transition:all .25s}
.score:first-child{border-color:rgba(46,204,113,.2);background:rgba(46,204,113,.04)}
.score:hover{transform:translateY(-2px);border-color:rgba(46,204,113,.3)}
.score .sc{font-size:1.3em;font-weight:700;color:#fff}
.score .sp{font-size:.65em;color:#4a5568;margin-top:2px}

/* 价值 */
.value{margin:0 18px 18px;padding:12px 16px;background:rgba(243,156,18,.04);border:1px solid rgba(243,156,18,.1);border-radius:12px;display:flex;align-items:center;gap:10px}
.value .icon{font-size:1.2em}
.value .text{font-size:.8em;color:#a0aec0}
.value .highlight{color:#f39c12;font-weight:600}

/* 分析详情 */
.detail{margin:0 18px 18px}
.detail-toggle{width:100%;padding:10px 16px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:10px;color:#718096;font-size:.8em;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all .2s}
.detail-toggle:hover{border-color:rgba(46,204,113,.2);color:#a0aec0}
.detail-content{margin-top:8px;padding:12px 16px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:10px;display:none}
.detail-content.open{display:block}
.detail-row{display:flex;justify-content:space-between;padding:6px 0;font-size:.75em;border-bottom:1px solid rgba(255,255,255,.03)}
.detail-row:last-child{border-bottom:none}
.detail-row .dl{color:#4a5568}
.detail-row .dr{color:#e8eaed;font-weight:500}
.detail-row .dr.g{color:#2ecc71}.detail-row .dr.r{color:#e74c3c}

/* 赔率 */
.odds{margin:0 18px 18px;padding:12px 16px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:10px;display:flex;justify-content:center;gap:16px;font-size:.8em}
.odds .label{color:#4a5568}
.odds .ov{font-weight:600}
.odds .h{color:#2ecc71}.odds .d{color:#f39c12}.odds .a{color:#e74c3c}

/* 分享 */
.share{margin:0 18px 18px;text-align:center}
.share-btn{padding:10px 28px;border-radius:12px;border:1px solid rgba(46,204,113,.2);background:rgba(46,204,113,.05);color:#2ecc71;font-size:.85em;cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(10px)}
.share-btn:hover{background:rgba(46,204,113,.15);border-color:rgba(46,204,113,.4);transform:translateY(-1px)}

/* 底部 */
.foot{text-align:center;padding:24px 0;color:#2d3748;font-size:.7em;line-height:1.6}
.empty{text-align:center;padding:80px 20px;color:#4a5568}
.empty .icon{font-size:3em;margin-bottom:12px;opacity:.5}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="app">
  <div class="hero">
    <div class="hero-badge"><span class="dot"></span> AI 实时分析</div>
    <h1>足球 <em>AI</em> 深度分析</h1>
    <p>竞彩官方数据 · 赔率概率模型</p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="pills" id="pills"></div>
  <div id="list"></div>
  <div class="foot">⚠️ 基于竞彩官方赔率的统计分析，仅供参考，不构成投注建议</div>
</div>

<script>
// 粒子
const C=document.getElementById('fx'),X=C.getContext('2d');let P=[];
function rz(){C.width=innerWidth;C.height=innerHeight}
class Pt{constructor(){this.r()}r(){this.x=Math.random()*C.width;this.y=Math.random()*C.height;this.s=Math.random()*3+1.5;this.vx=(Math.random()-.5)*.4;this.vy=(Math.random()-.5)*.4;this.o=Math.random()*.25+.1;this.c=['#2ecc71','#1a5a3a','#0d3a1a'][Math.random()*3|0]}u(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>C.width)this.vx*=-1;if(this.y<0||this.y>C.height)this.vy*=-1}d(){X.beginPath();X.arc(this.x,this.y,this.s,0,6.28);X.fillStyle=this.c;X.globalAlpha=this.o;X.fill();X.globalAlpha=1}}
function init(){rz();P=[];for(let i=0;i<50;i++)P.push(new Pt())}
function anim(){X.clearRect(0,0,C.width,C.height);for(let i=0;i<P.length;i++){for(let j=i+1;j<P.length;j++){const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<180){X.beginPath();X.moveTo(P[i].x,P[i].y);X.lineTo(P[j].x,P[j].y);X.strokeStyle='#2ecc71';X.globalAlpha=(1-d/180)*.15;X.lineWidth=1;X.stroke();X.globalAlpha=1}}}P.forEach(p=>{p.u();p.d()});requestAnimationFrame(anim)}
addEventListener('resize',rz);init();anim();

// 分析引擎
function crsP(c){const p={};let t=0;for(const[k,o]of Object.entries(c))if(o>0){p[k]=1/o;t+=p[k]}for(const k in p)p[k]/=t;return p}
function hda(p){let h=0,d=0,a=0;for(const[k,v]of Object.entries(p)){const g=+k.slice(1,3),e=+k.slice(4,6);if(g>e)h+=v;else if(g===e)d+=v;else a+=v}return{h,d,a}}
function ou(p){let o25=0;for(const[k,v]of Object.entries(p)){if(+k.slice(1,3)+ +k.slice(4,6)>=3)o25+=v}return{o25,u25:1-o25}}
function xg(p){let hx=0,ax=0;for(const[k,v]of Object.entries(p)){hx+= +k.slice(1,3)*v;ax+= +k.slice(4,6)*v}return{h:hx,a:ax,t:hx+ax}}
function htft(h){let hh=0,hd=0,ha=0;for(const[k,o]of Object.entries(h)){if(o<=0)continue;const p=1/o;if(k[0]==='h')hh+=p;else if(k[0]==='d')hd+=p;else ha+=p}const s=hh+hd+ha;return{h:hh/s,d:hd/s,a:ha/s}}
function hc(h){const l=parseFloat(h.line)||0;if(!l||!h.home||!h.away)return null;const s=1/h.home+1/h.away;return{l,h:(1/h.home)/s,a:(1/h.away)/s}}
function ana(m){const cp=crsP(m.crs),H=hda(cp),O=ou(cp),X=xg(cp),ht=htft(m.htft),hc_=hc(m.handicap),sr=Object.entries(cp).map(([k,p])=>({s:`${+k.slice(1,3)}-${+k.slice(4,6)}`,p})).sort((a,b)=>b.p-a.p),mx=Math.max(H.h,H.d,H.a),sc=[H.h,H.d,H.a].sort((a,b)=>b-a)[1],cf=mx-sc>.25?5:mx-sc>.15?4:mx-sc>.08?3:2,v={h:H.h*m.odds.home-1,d:H.d*m.odds.draw-1,a:H.a*m.odds.away-1};return{H,O,X,ht,hc:hc_,sr,cf,v}}

// 全局
let M=[],F='all';

async function load(){
  try{
    const r=await fetch('data/matches.json?t='+Date.now()),d=await r.json();
    M=d.matches||[];
    document.getElementById('stats').innerHTML=`<div class="stat"><div class="n">${M.length}</div><div class="l">赛事</div></div><div class="stat"><div class="n">${M.length>0?(M.reduce((s,m)=>s+xg(crsP(m.crs)).t,0)/M.length).toFixed(1):'-'}</div><div class="l">平均进球</div></div><div class="stat"><div class="n">${d.updated?.split(' ')[1]||'-'}</div><div class="l">更新时间</div></div>`;
    pills();render();
  }catch(e){document.getElementById('list').innerHTML='<div class="empty"><div class="icon">📡</div>数据加载失败</div>'}
}

function pills(){
  const ls=[...new Set(M.map(m=>m.league))].sort();
  document.getElementById('pills').innerHTML=`<button class="pill ${F==='all'?'on':''}" onclick="F='all';pills();render()">全部</button>`+ls.map(l=>`<button class="pill ${F===l?'on':''}" onclick="F='${l}';pills();render()">${l}</button>`).join('');
}

function render(){
  const ms=F==='all'?M:M.filter(m=>m.league===F);
  if(!ms.length){document.getElementById('list').innerHTML='<div class="empty"><div class="icon">📅</div>暂无赛事</div>';return}
  document.getElementById('list').innerHTML=ms.map(card).join('');
}

function card(m){
  const a=ana(m),p=a.H,hp=Math.round(p.h*100),dp=Math.round(p.d*100),ap=Math.round(p.a*100);
  const mx=Math.max(p.h,p.d,p.a);
  const pick=p.h===mx?'主胜':p.a===mx?'客胜':'平局';
  const pickP=Math.round(mx*100),pickO=p.h===mx?m.odds.home:p.a===mx?m.odds.away:m.odds.draw;
  const stars='★'.repeat(a.cf)+'☆'.repeat(5-a.cf);
  const vals=Object.entries(a.v).filter(([_,v])=>v>.05);
  const over=a.O.o25>.5;
  const id=m.id;

  return`
  <div class="card">
    <div class="card-head">
      <span class="card-league">${m.league}</span>
      <span class="card-time"><span class="live"></span> ${m.time}</span>
    </div>
    <div class="teams">
      <div class="team"><div class="crest">⚽</div><div class="t-name">${m.home.name}</div>${m.home.rank?`<div class="t-rank">${m.home.rank}</div>`:''}</div>
      <div class="vs">VS</div>
      <div class="team"><div class="crest">⚽</div><div class="t-name">${m.away.name}</div>${m.away.rank?`<div class="t-rank">${m.away.rank}</div>`:''}</div>
    </div>
    <div class="prob">
      <div class="prob-bar">
        <div class="seg seg-h" style="width:${hp}%">${hp}%</div>
        <div class="seg seg-d" style="width:${dp}%">${dp}%</div>
        <div class="seg seg-a" style="width:${ap}%">${ap}%</div>
      </div>
      <div class="prob-labels"><span>主胜</span><span>平局</span><span>客胜</span></div>
    </div>
    <div class="rec">
      <div class="rec-card">
        <div class="rec-label">🎯 推荐</div>
        <div class="rec-value">${pick}</div>
        <div class="rec-meta">
          <span class="green">概率 ${pickP}%</span>
          <span>赔率 ${pickO}</span>
          <span class="rec-stars">${stars}</span>
        </div>
      </div>
    </div>
    <div class="scores">
      <div class="score"><div class="sc">${a.sr[0].s}</div><div class="sp">${Math.round(a.sr[0].p*100)}%</div></div>
      <div class="score"><div class="sc">${a.sr[1].s}</div><div class="sp">${Math.round(a.sr[1].p*100)}%</div></div>
    </div>
    ${vals.length?`<div class="value"><span class="icon">💰</span><span class="text">价值发现：<span class="highlight">${vals.map(([k,v])=>`${k==='h'?'主胜':k==='d'?'平局':'客胜'} +${Math.round(v*100)}%`).join('，')}</span></span></div>`:''}
    <div class="detail">
      <button class="detail-toggle" onclick="this.nextElementSibling.classList.toggle('open')">📊 详细数据 <span>▼</span></button>
      <div class="detail-content">
        <div class="detail-row"><span class="dl">预计进球</span><span class="dr">${a.X.t.toFixed(1)}</span></div>
        <div class="detail-row"><span class="dl">大2.5球</span><span class="dr ${over?'g':'r'}">${Math.round(a.O.o25*100)}%</span></div>
        <div class="detail-row"><span class="dl">半场主队领先</span><span class="dr">${Math.round(a.ht.h*100)}%</span></div>
        <div class="detail-row"><span class="dl">半场平局</span><span class="dr">${Math.round(a.ht.d*100)}%</span></div>
        <div class="detail-row"><span class="dl">主队期望进球</span><span class="dr">${a.X.h.toFixed(2)}</span></div>
        <div class="detail-row"><span class="dl">客队期望进球</span><span class="dr">${a.X.a.toFixed(2)}</span></div>
        ${a.hc?`<div class="detail-row"><span class="dl">让球${Math.abs(a.hc.l)}球</span><span class="dr">主${Math.round(a.hc.h*100)}% 客${Math.round(a.hc.a*100)}%</span></div>`:''}
      </div>
    </div>
    <div class="share"><button class="share-btn" onclick="share(${id})">📤 分享分析</button></div>
    <div class="odds"><span class="label">竞彩赔率</span><span class="ov h">主${m.odds.home}</span><span class="ov d">平${m.odds.draw}</span><span class="ov a">客${m.odds.away}</span></div>
  </div>`;
}

function share(id){
  const m=M.find(x=>x.id===id);if(!m)return;
  const a=ana(m),mx=Math.max(a.H.h,a.H.d,a.H.a),pick=a.H.h===mx?'主胜':a.H.a===mx?'客胜':'平局';
  const t=`⚽ ${m.home.name} vs ${m.away.name}\n🏆 ${m.league}\n⏰ ${m.time}\n\n🎯 推荐：${pick} (${Math.round(mx*100)}%)\n📊 比分：${a.sr[0].s}\n⚽ ${a.O.o25>.5?'大':'小'}2.5球\n\n竞彩赔率: 主${m.odds.home} 平${m.odds.draw} 客${m.odds.away}`;
  navigator.share?navigator.share({title:`${m.home.name} vs ${m.away.name}`,text:t}):navigator.clipboard.writeText(t).then(()=>alert('已复制'));
}

load();
</script>
</body>
</html>
