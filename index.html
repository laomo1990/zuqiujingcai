<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ 足球AI分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','SF Pro Display','Microsoft YaHei',sans-serif;background:#050810;color:#e8eaed;min-height:100vh;overflow-x:hidden}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:16px 12px;min-height:100vh}

/* 头部 */
.hero{text-align:center;padding:24px 0 16px}
.hero h1{font-size:1.4em;font-weight:800;background:linear-gradient(135deg,#fff,#a0aec0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,#2ecc71,#00d2ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#4a5568;font-size:.75em;margin-top:4px}

/* 统计条 */
.stats{display:flex;gap:6px;margin:0 0 14px}
.stat{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:8px;text-align:center}
.stat .n{font-size:1.1em;font-weight:700;color:#fff}
.stat .l{font-size:.55em;color:#4a5568;margin-top:1px}

/* 筛选 */
.pills{display:flex;gap:5px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{padding:4px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:transparent;color:#718096;font-size:.7em;cursor:pointer;white-space:nowrap;transition:all .2s}
.pill:hover{border-color:rgba(46,204,113,.3)}
.pill.on{background:rgba(46,204,113,.15);border-color:rgba(46,204,113,.4);color:#2ecc71;font-weight:600}

/* 骨架屏 */
.sk-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px;margin:0 0 12px}
.sk-head{height:10px;width:100px;background:rgba(255,255,255,.05);border-radius:4px;margin-bottom:14px;animation:pulse 1.5s ease infinite}
.sk-row{display:flex;align-items:center;gap:12px;margin:12px 0}
.sk-circle{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.05);animation:pulse 1.5s ease infinite}
.sk-vs{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.03);animation:pulse 1.5s ease infinite}
.sk-bar{height:20px;background:rgba(255,255,255,.04);border-radius:6px;margin:12px 0;animation:pulse 1.5s ease infinite}
.sk-line{height:8px;background:rgba(255,255,255,.04);border-radius:3px;margin:6px 0;animation:pulse 1.5s ease infinite}
.sk-line.short{width:60%}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.2}}

/* 赛事卡片 */
.card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:14px;margin:0 0 12px;overflow:hidden}

/* 卡片头部 */
.card-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04)}
.card-league{font-size:.65em;color:#4a5568;font-weight:500}
.card-time{font-size:.65em;color:#f39c12}

/* 队伍 */
.teams{padding:16px 14px;display:flex;align-items:center;justify-content:center;gap:14px}
.team{text-align:center;flex:1}
.crest{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:1.2em}
.t-name{font-size:.85em;font-weight:600;margin-top:5px}
.t-rank{font-size:.5em;color:#f39c12;background:rgba(243,156,18,.08);padding:1px 5px;border-radius:5px;margin-top:2px;display:inline-block}
.vs{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:.6em;font-weight:700;color:#4a5568}

/* 核心推荐 */
.core{margin:0 14px 12px;padding:14px;background:rgba(46,204,113,.04);border:1px solid rgba(46,204,113,.1);border-radius:10px}
.core-pick{font-size:1.3em;font-weight:800;color:#fff;margin-bottom:4px}
.core-meta{font-size:.7em;color:#718096}
.core-meta .green{color:#2ecc71}
.core-stars{color:#f39c12;font-size:.75em;letter-spacing:1px}

/* 概率条 */
.prob-bar{display:flex;height:20px;border-radius:5px;overflow:hidden;gap:2px;margin:10px 0 6px}
.seg{display:flex;align-items:center;justify-content:center;font-size:.6em;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);border-radius:3px}
.seg-h{background:linear-gradient(180deg,#3a9d5d,#2ecc71)}
.seg-d{background:linear-gradient(180deg,#d4a017,#f39c12)}
.seg-a{background:linear-gradient(180deg,#c0392b,#e74c3c)}
.prob-labels{display:flex;justify-content:space-between;font-size:.55em;color:#4a5568}

/* 理由 */
.reason{margin:0 14px 12px;padding:10px 12px;background:rgba(0,210,255,.02);border:1px solid rgba(0,210,255,.06);border-radius:8px}
.reason-text{font-size:.7em;color:#a0aec0;line-height:1.5}

/* 比分 */
.scores{display:flex;gap:8px;margin:0 14px 12px}
.score{flex:1;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:8px;padding:8px;text-align:center}
.score:first-child{border-color:rgba(46,204,113,.12);background:rgba(46,204,113,.02)}
.score .sc{font-size:1em;font-weight:700;color:#fff}
.score .sp{font-size:.55em;color:#4a5568;margin-top:1px}

/* 价值 */
.value{margin:0 14px 12px;padding:8px 12px;background:rgba(243,156,18,.03);border:1px solid rgba(243,156,18,.08);border-radius:8px;display:flex;align-items:center;gap:6px}
.value .v-icon{font-size:.9em}
.value .v-text{font-size:.7em;color:#a0aec0}
.value .v-hl{color:#f39c12;font-weight:600}

/* 折叠详情 */
.detail{margin:0 14px 12px}
.detail-toggle{width:100%;padding:8px 12px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:8px;color:#718096;font-size:.7em;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.detail-toggle:hover{border-color:rgba(46,204,113,.15)}
.detail-body{margin-top:4px;padding:10px 12px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.03);border-radius:8px;display:none}
.detail-body.open{display:block}
.d-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.65em;border-bottom:1px solid rgba(255,255,255,.02)}
.d-row:last-child{border-bottom:none}
.d-row .dl{color:#4a5568}
.d-row .dr{color:#e8eaed;font-weight:500}
.d-row .dr.g{color:#2ecc71}.d-row .dr.r{color:#e74c3c}

/* 复盘模块 */
.history{margin:0 0 16px}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.history-title{font-size:.85em;font-weight:700;color:#fff}
.history-sub{font-size:.65em;color:#4a5568}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stats-item{text-align:center;padding:10px 6px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:10px}
.stats-item .si-val{font-size:1.2em;font-weight:700;color:#fff}
.stats-item .si-val.good{color:#2ecc71}.stats-item .si-val.mid{color:#f39c12}.stats-item .si-val.bad{color:#e74c3c}
.stats-item .si-label{font-size:.55em;color:#4a5568;margin-top:2px}
.history-list{display:flex;flex-direction:column;gap:6px}
.history-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:10px;font-size:.7em}
.history-row .hr-date{color:#4a5568;width:55px;flex-shrink:0}
.history-row .hr-teams{flex:1;color:#e8eaed;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-row .hr-score{color:#fff;font-weight:600;width:35px;text-align:center;flex-shrink:0}
.history-row .hr-pick{width:30px;text-align:center;flex-shrink:0}
.history-row .hr-result{display:flex;gap:4px;flex-shrink:0}
.history-row .hr-tag{padding:1px 5px;border-radius:4px;font-size:.85em}
.history-row .hr-tag.hit{background:rgba(46,204,113,.15);color:#2ecc71}
.history-row .hr-tag.miss{background:rgba(231,76,60,.15);color:#e74c3c}

/* 社群 */
.community{margin:16px 0;padding:16px;background:rgba(46,204,113,.04);border:1px solid rgba(46,204,113,.08);border-radius:12px;text-align:center}
.community h3{font-size:.85em;color:#fff;margin-bottom:4px}
.community p{font-size:.7em;color:#718096;margin-bottom:12px}
.community .qr-box{display:inline-block;padding:8px;background:#fff;border-radius:8px}
.community .qr-box img{width:120px;height:120px;display:block}
.community .hint{font-size:.6em;color:#4a5568;margin-top:8px}

.foot{text-align:center;padding:16px 0;color:#2d3748;font-size:.6em;line-height:1.4}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="app">
  <div class="hero">
    <h1>足球 <em>AI</em> 分析</h1>
    <p>竞彩数据 · 泊松模型 · 价值发现</p>
  <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px">
    <span id="updateRel" style="font-size:.65em;color:#4a5568">-</span>
    <button onclick="refreshData()" style="padding:3px 10px;border-radius:12px;border:1px solid rgba(46,204,113,.2);background:rgba(46,204,113,.05);color:#2ecc71;font-size:.65em;cursor:pointer">🔄 刷新</button>
  </div>
  </div>
  <div class="stats" id="stats">
    <div class="stat"><div class="n">-</div><div class="l">赛事</div></div>
    <div class="stat"><div class="n">-</div><div class="l">平均进球</div></div>
    <div class="stat"><div class="n">-</div><div class="l">更新</div></div>
  </div>
  <div class="pills" id="pills"></div>
  <div class="history" id="history">
    <div class="history-header">
      <span class="history-title">📈 最近7天复盘</span>
      <span class="history-sub" id="historySub">-</span>
    </div>
    <div class="stats-grid" id="historyStats"></div>
    <div class="history-list" id="historyList"></div>
  </div>
  <div id="list">
    <div class="sk-card">
      <div class="sk-head"></div>
      <div class="sk-row"><div class="sk-circle"></div><div class="sk-vs"></div><div class="sk-circle"></div></div>
      <div class="sk-bar"></div>
      <div class="sk-line"></div><div class="sk-line short"></div>
    </div>
    <div class="sk-card">
      <div class="sk-head"></div>
      <div class="sk-row"><div class="sk-circle"></div><div class="sk-vs"></div><div class="sk-circle"></div></div>
      <div class="sk-bar"></div>
      <div class="sk-line"></div><div class="sk-line short"></div>
    </div>
  </div>
  <div class="community">
    <h3>💬 赛事交流群</h3>
    <p>扫码添加微信，加入足球分析交流群</p>
    <div class="qr-box"><img src="data:image/jpeg;base64,QR" alt="微信二维码" id="qrImg"></div>
    <div class="hint">长按识别二维码</div>
  </div>
  <div class="foot">⚠️ 基于竞彩官方数据的统计分析，仅供参考，不构成投注建议</div>
</div>

<script>
let C,X,P=[];
try{C=document.getElementById('fx');if(C)X=C.getContext('2d')}catch(e){}
function rz(){if(C){C.width=innerWidth;C.height=innerHeight}}
class Pt{constructor(){this.x=Math.random()*innerWidth;this.y=Math.random()*innerHeight;this.s=Math.random()*2.5+1;this.vx=(Math.random()-.5)*.3;this.vy=(Math.random()-.5)*.3;this.o=Math.random()*.2+.08;this.c=['#2ecc71','#1a5a3a','#0d3a1a'][Math.random()*3|0]}u(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>innerWidth)this.vx*=-1;if(this.y<0||this.y>innerHeight)this.vy*=-1}d(){if(!X)return;X.beginPath();X.arc(this.x,this.y,this.s,0,6.28);X.fillStyle=this.c;X.globalAlpha=this.o;X.fill();X.globalAlpha=1}}
function init(){rz();P=[];for(let i=0;i<35;i++)P.push(new Pt())}
function anim(){if(C&&X){X.clearRect(0,0,C.width,C.height);for(let i=0;i<P.length;i++){for(let j=i+1;j<P.length;j++){const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<120){X.beginPath();X.moveTo(P[i].x,P[i].y);X.lineTo(P[j].x,P[j].y);X.strokeStyle='#2ecc71';X.globalAlpha=(1-d/120)*.1;X.lineWidth=1;X.stroke();X.globalAlpha=1}}}P.forEach(p=>{p.u();p.d()})}requestAnimationFrame(anim)}
addEventListener('resize',rz);init();anim();

// ========== 分析引擎 ==========
const HA=.35;
function factorial(n){if(n<=1)return 1;let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function poisson(k,l){return(l**k)*Math.exp(-l)/factorial(k)}
function crsP(c){const p={};let t=0;for(const[k,o]of Object.entries(c))if(o>0){p[k]=1/o;t+=p[k]}for(const k in p)p[k]/=t;return p}
function crsHDA(p){let h=0,d=0,a=0;for(const[k,v]of Object.entries(p)){const g=+k.slice(1,3),e=+k.slice(4,6);if(g>e)h+=v;else if(g===e)d+=v;else a+=v}return{h,d,a}}
function estLambda(p,isH){const gp={};for(const[k,v]of Object.entries(p)){const g=isH?+k.slice(1,3):+k.slice(4,6);gp[g]=(gp[g]||0)+v}let best=1,bs=Infinity;for(let l=5;l<=35;l++){const lam=l/10;let s=0;for(const[g,op]of Object.entries(gp))s+=(op-poisson(+g,lam))**2;if(s<bs){bs=s;best=lam}}return{lam:best,gp}}
function poisModel(hL,aL){const hA=HA,aH=hL+hA,aA=Math.max(.3,aL-hA*.3);let h=0,d=0,a=0;for(let i=0;i<=6;i++)for(let j=0;j<=6;j++){const p=poisson(i,aH)*poisson(j,aA);if(i>j)h+=p;else if(i===j)d+=p;else a+=p}return{h,d,a,hL:aH,aL:aA}}
function ana(m){
  const cp=crsP(m.crs),ch=crsHDA(cp),hE=estLambda(cp,true),aE=estLambda(cp,false);
  const pm=poisModel(hE.lam,aE.lam);
  const mp={h:1/m.odds.home,d:1/m.odds.draw,a:1/m.odds.away};const ms=mp.h+mp.d+mp.a;mp.h/=ms;mp.d/=ms;mp.a/=ms;
  const te={h:(pm.h-mp.h)*100,d:(pm.d-mp.d)*100,a:(pm.a-mp.a)*100};
  const sr=Object.entries(cp).map(([k,p])=>({s:`${+k.slice(1,3)}-${+k.slice(4,6)}`,p})).sort((a,b)=>b.p-a.p);
  let o25=0;for(const[k,v]of Object.entries(cp))if(+k.slice(1,3)+ +k.slice(4,6)>=3)o25+=v;
  const val={h:pm.h*m.odds.home-1,d:pm.d*m.odds.draw-1,a:pm.a*m.odds.away-1};
  const mx=Math.max(pm.h,pm.d,pm.a),mn=Math.min(pm.h,pm.d,pm.a),sp=mx-mn;
  const conf=sp>.25?4:sp>.15?3:sp>.08?2:1;
  const stars='★'.repeat(conf)+'☆'.repeat(4-conf);
  const ci={h:Math.round(Math.sqrt(pm.h*(1-pm.h)/30)*200),d:Math.round(Math.sqrt(pm.d*(1-pm.d)/30)*200),a:Math.round(Math.sqrt(pm.a*(1-pm.a)/30)*200)};
  return{pm,te,sr,o25,val,conf,stars,ci,hL:pm.hL,aL:pm.aL};
}

function reason(m,a){
  const mx=Math.max(a.pm.h,a.pm.d,a.pm.a);
  const pick=a.pm.h===mx?'主队':a.pm.away===mx?'客队':'两队';
  let r=`泊松模型显示${pick}场均进球更高（主${a.hL.toFixed(1)}·客${a.aL.toFixed(1)}）`;
  const te=[a.te.h,a.te.d,a.te.a];
  const big=te.find(v=>Math.abs(v)>2);
  if(big){
    const idx=te.indexOf(big);
    const name=['主胜','平局','客胜'][idx];
    r+=`，${name}${big>0?'被市场低估':'被市场高估'}${Math.abs(big).toFixed(1)}%`;
  }
  return r+'。';
}

let M=[],F='all',lastUpdate=null;

// 相对时间
function relTime(ts){
  if(!ts)return'-';
  const diff=Math.floor((Date.now()-ts)/1000);
  if(diff<60)return'刚刚更新';
  if(diff<3600)return Math.floor(diff/60)+'分钟前更新';
  if(diff<86400)return Math.floor(diff/3600)+'小时前更新';
  return Math.floor(diff/86400)+'天前更新';
}

// 刷新相对时间显示
function updateRelTime(){
  const el=document.getElementById('updateRel');
  if(el)el.textContent=relTime(lastUpdate);
}

// ========== 历史复盘 ==========
let H=null;

async function loadHistory(){
  try{
    const r=await fetch('data/history.json?t='+Date.now());
    H=await r.json();
    renderHistory();
  }catch(e){
    document.getElementById('history').style.display='none';
  }
}

function renderHistory(){
  if(!H||!H.summary){document.getElementById('history').style.display='none';return}
  const s=H.summary;
  document.getElementById('historySub').textContent=`${s.total}场比赛`;
  
  // 统计卡片
  document.getElementById('historyStats').innerHTML=`
    <div class="stats-item"><div class="si-val ${s.spf_rate>=60?'good':s.spf_rate>=50?'mid':'bad'}">${s.spf_rate}%</div><div class="si-label">胜平负</div></div>
    <div class="stats-item"><div class="si-val ${s.score_rate>=30?'good':s.score_rate>=20?'mid':'bad'}">${s.score_rate}%</div><div class="si-label">比分</div></div>
    <div class="stats-item"><div class="si-val ${s.goal_rate>=55?'good':s.goal_rate>=45?'mid':'bad'}">${s.goal_rate}%</div><div class="si-label">大小球</div></div>
    <div class="stats-item"><div class="si-val ${s.roi>0?'good':'bad'}">${s.roi>0?'+':''}${s.roi}%</div><div class="si-label">收益率</div></div>
  `;
  
  // 比赛列表
  document.getElementById('historyList').innerHTML=H.matches.map(m=>{
    const spfHit=m.result.pick==='✅';
    const scoreHit=m.result.score==='✅';
    const ouHit=m.result.ou==='✅';
    return`<div class="history-row">
      <span class="hr-date">${m.date.slice(5)}</span>
      <span class="hr-teams">${m.home} vs ${m.away}</span>
      <span class="hr-score">${m.home_score}-${m.away_score}</span>
      <span class="hr-pick">${m.prediction.pick}</span>
      <div class="hr-result">
        <span class="hr-tag ${spfHit?'hit':'miss'}">${m.result.pick}</span>
        <span class="hr-tag ${scoreHit?'hit':'miss'}">${m.result.score}</span>
        <span class="hr-tag ${ouHit?'hit':'miss'}">${m.result.ou}</span>
      </div>
    </div>`;
  }).join('');
}

// 手动刷新
async function refreshData(){
  const btn=event.target;
  btn.textContent='刷新中...';
  btn.disabled=true;
  await load();
  btn.textContent='🔄 刷新';
  btn.disabled=false;
}

// 自动刷新（每5分钟）
setInterval(()=>{load()},5*60*1000);
// 每分钟更新相对时间显示
setInterval(updateRelTime,60*1000);

async function load(){
  try{
    const r=await fetch('data/matches.json?t='+Date.now()),d=await r.json();
    M=d.matches||[];
    lastUpdate=Date.now();
    const avg=M.length?(M.reduce((s,m)=>{const a=ana(m);return s+a.hL+a.aL},0)/M.length).toFixed(1):'-';
    document.getElementById('stats').innerHTML=`<div class="stat"><div class="n">${M.length}</div><div class="l">赛事</div></div><div class="stat"><div class="n">${avg}</div><div class="l">平均进球</div></div><div class="stat"><div class="n">${d.updated?.split(' ')[1]||'-'}</div><div class="l">更新</div></div>`;
    updateRelTime();
    pills();render();
    loadHistory();
  }catch(e){document.getElementById('list').innerHTML='<div style="text-align:center;padding:60px;color:#4a5568">📡 数据加载失败</div>'}
}

function pills(){
  const ls=[...new Set(M.map(m=>m.league))].sort();
  document.getElementById('pills').innerHTML=`<button class="pill ${F==='all'?'on':''}" onclick="F='all';pills();render()">全部</button>`+ls.map(l=>`<button class="pill ${F===l?'on':''}" onclick="F='${l}';pills();render()">${l}</button>`).join('');
}

function render(){
  const ms=F==='all'?M:M.filter(m=>m.league===F);
  if(!ms.length){document.getElementById('list').innerHTML='<div style="text-align:center;padding:60px;color:#4a5568">📅 暂无赛事</div>';return}
  document.getElementById('list').innerHTML=ms.map(card).join('');
}

function card(m){
  const a=ana(m);
  const hp=Math.round(a.pm.h*100),dp=Math.round(a.pm.d*100),ap=Math.round(a.pm.a*100);
  const mx=Math.max(a.pm.h,a.pm.d,a.pm.a);
  const pick=a.pm.h===mx?'主胜':a.pm.away===mx?'客胜':'平局';
  const pickP=Math.round(mx*100);
  const pickO=a.pm.h===mx?m.odds.home:a.pm.away===mx?m.odds.away:m.odds.draw;
  const vals=Object.entries(a.val).filter(([_,v])=>v>.03);
  const over=a.o25>.5;

  return`
  <div class="card">
    <div class="card-top">
      <span class="card-league">${m.league}</span>
      <span class="card-time">${m.time}</span>
    </div>
    <div class="teams">
      <div class="team"><div class="crest">⚽</div><div class="t-name">${m.home.name}</div>${m.home.rank?`<div class="t-rank">${m.home.rank}</div>`:''}</div>
      <div class="vs">VS</div>
      <div class="team"><div class="crest">⚽</div><div class="t-name">${m.away.name}</div>${m.away.rank?`<div class="t-rank">${m.away.rank}</div>`:''}</div>
    </div>
    <div class="core">
      <div class="core-pick">🎯 ${pick}</div>
      <div class="core-meta"><span class="green">${pickP}%概率</span> · 赔率${pickO} · <span class="core-stars">${a.stars}</span></div>
      <div class="prob-bar">
        <div class="seg seg-h" style="width:${hp}%">${hp}%</div>
        <div class="seg seg-d" style="width:${dp}%">${dp}%</div>
        <div class="seg seg-a" style="width:${ap}%">${ap}%</div>
      </div>
      <div class="prob-labels"><span>主胜</span><span>平局</span><span>客胜</span></div>
    </div>
    <div class="reason">
      <div class="reason-text">💡 ${reason(m,a)}</div>
    </div>
    <div class="scores">
      <div class="score"><div class="sc">${a.sr[0].s}</div><div class="sp">${Math.round(a.sr[0].p*100)}%</div></div>
      <div class="score"><div class="sc">${a.sr[1].s}</div><div class="sp">${Math.round(a.sr[1].p*100)}%</div></div>
    </div>
    ${vals.length?`<div class="value"><span class="v-icon">💰</span><span class="v-text">价值：<span class="v-hl">${vals.map(([k,v])=>`${k==='h'?'主胜':k==='d'?'平局':'客胜'} +${Math.round(v*100)}%`).join('，')}</span></span></div>`:''}
    <div class="detail">
      <button class="detail-toggle" onclick="this.nextElementSibling.classList.toggle('open')">📊 详细数据 <span>▼</span></button>
      <div class="detail-body">
        <div class="d-row"><span class="dl">预计进球</span><span class="dr">${(a.hL+a.aL).toFixed(1)}</span></div>
        <div class="d-row"><span class="dl">大2.5球</span><span class="dr ${over?'g':'r'}">${Math.round(a.o25*100)}%</span></div>
        <div class="d-row"><span class="dl">主胜边际</span><span class="dr ${a.te.h>0?'g':'r'}">${a.te.h>0?'+':''}${a.te.h.toFixed(1)}%</span></div>
        <div class="d-row"><span class="dl">平局边际</span><span class="dr ${a.te.d>0?'g':'r'}">${a.te.d>0?'+':''}${a.te.d.toFixed(1)}%</span></div>
        <div class="d-row"><span class="dl">客胜边际</span><span class="dr ${a.te.a>0?'g':'r'}">${a.te.a>0?'+':''}${a.te.a.toFixed(1)}%</span></div>
        <div class="d-row"><span class="dl">置信区间</span><span class="dr">主±${a.ci.h}% 平±${a.ci.d}% 客±${a.ci.a}%</span></div>
        <div class="d-row"><span class="dl">主场优势</span><span class="dr">+${HA}球</span></div>
        <div class="d-row"><span class="dl">竞彩赔率</span><span class="dr">主${m.odds.home} 平${m.odds.draw} 客${m.odds.away}</span></div>
      </div>
    </div>
  </div>`;
}

load();
</script>
</body>
</html>
