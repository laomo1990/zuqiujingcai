<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ 足球 AI 深度分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0e17;color:#e0e0e0;min-height:100vh;overflow-x:hidden}
.container{max-width:800px;margin:0 auto;padding:12px;position:relative;z-index:1}
#particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

.header{text-align:center;padding:24px 0 16px;position:relative}
.header h1{font-size:1.5em;font-weight:700;color:#fff;text-shadow:0 0 20px rgba(46,204,113,0.3)}
.header h1 .accent{color:#2ecc71}
.header p{color:#556;font-size:0.8em;margin-top:4px}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:80px;height:3px;background:linear-gradient(90deg,transparent,#2ecc71,transparent);border-radius:2px}
.update-time{text-align:center;font-size:0.7em;color:#445;padding:10px 0}

/* Tab筛选 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{padding:6px 14px;border-radius:16px;border:1px solid #1e2d3d;background:transparent;color:#889;font-size:0.8em;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab-btn:hover{border-color:#2ecc71;color:#2ecc71}
.tab-btn.active{background:#2ecc71;color:#fff;border-color:#2ecc71}

/* 统计摘要 */
.stats-bar{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.stat-pill{background:#0d1117;border:1px solid #1e2d3d;border-radius:8px;padding:6px 12px;font-size:0.75em;display:flex;align-items:center;gap:4px}
.stat-pill .label{color:#667}
.stat-pill .value{color:#2ecc71;font-weight:600}

/* 赛事卡片 */
.match-card{background:linear-gradient(180deg,#111827ee,#0d1117dd);border-radius:16px;margin:14px 0;overflow:hidden;position:relative;border:1px solid #1e2d3d}
.match-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#2ecc71,#27ae60,#2ecc71);background-size:200%;animation:shimmer 3s ease infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.league-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#0d1117;border-bottom:1px solid #1e2d3d}
.league-name{font-size:0.8em;color:#889;font-weight:500}
.match-time{font-size:0.75em;color:#f39c12;display:flex;align-items:center;gap:6px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#2ecc71;animation:pulse 2s ease infinite;box-shadow:0 0 8px #2ecc71}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}

/* 已完赛 */
.match-result{background:#1a2332;padding:8px 16px;display:flex;justify-content:center;align-items:center;gap:12px;font-size:0.9em}
.match-result .score{font-size:1.4em;font-weight:700;color:#fff}
.match-result .team-name{color:#889;font-size:0.85em}
.match-result .win{color:#2ecc71}

/* 球队 */
.teams-area{padding:24px 16px;position:relative;background:linear-gradient(180deg,#0d1117,#111827)}
.teams-area::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border:1px solid #1e2d3d;border-radius:50%;opacity:0.3}
.teams-area::after{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:#1e2d3d;opacity:0.3}
.match-teams{display:flex;align-items:center;justify-content:center;gap:24px;position:relative;z-index:1}
.team{text-align:center;flex:1}
.team-crest{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#1a2332,#0d1117);border:2px solid #2a3a4a;display:flex;align-items:center;justify-content:center;margin:0 auto;transition:all .3s}
.team-crest:hover{border-color:#2ecc71;box-shadow:0 0 15px rgba(46,204,113,0.3)}
.team-crest::after{content:'';position:absolute;inset:4px;border-radius:50%;border:1px solid #3a4a5a}
.team-crest .icon{font-size:2em}
.team-name{font-size:1em;font-weight:600;margin-top:8px;color:#fff}
.team-rank{font-size:0.65em;color:#f39c12;background:#f39c1211;padding:1px 6px;border-radius:4px;margin-top:3px;display:inline-block}
.vs-badge{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#1a2332,#0d1117);border:2px solid #2a3a4a;display:flex;align-items:center;justify-content:center;font-size:0.85em;font-weight:bold;color:#889;position:relative;z-index:1}

/* 概率条 */
.prob-field{margin:12px 16px;padding:14px;background:linear-gradient(135deg,#0d2818 0%,#0a1f14 50%,#0d2818 100%);border-radius:12px;border:1px solid #1a3a2a;position:relative;overflow:hidden}
.prob-bar{display:flex;height:32px;border-radius:8px;overflow:hidden;margin-bottom:8px;box-shadow:inset 0 2px 4px rgba(0,0,0,0.3);gap:2px}
.prob-segment{display:flex;align-items:center;justify-content:center;font-size:0.8em;font-weight:bold;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.5);border-radius:6px}
.prob-home-bg{background:linear-gradient(180deg,#3a9d5d,#2ecc71,#27ae60)}
.prob-draw-bg{background:linear-gradient(180deg,#d4a017,#f39c12,#e67e22)}
.prob-away-bg{background:linear-gradient(180deg,#c0392b,#e74c3c,#d63031)}
.prob-labels{display:flex;justify-content:space-between;font-size:0.7em;color:#4a6a5a;font-weight:500}

/* 方案 */
.schemes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 16px}
.scheme{background:#0d1117;border:1px solid #1e2d3d;border-radius:12px;padding:12px 8px;text-align:center;transition:all .3s}
.scheme:hover{border-color:#2ecc71;transform:translateY(-2px);box-shadow:0 4px 15px rgba(46,204,113,0.2)}
.scheme.main{border-color:#2ecc71;border-left:3px solid #2ecc71;background:linear-gradient(135deg,#0d1117,#0d2818)}
.scheme .s-label{font-size:0.65em;color:#667;margin-bottom:4px}
.scheme .s-value{font-size:1.1em;font-weight:700;color:#fff}
.scheme .s-detail{font-size:0.65em;color:#889;margin-top:3px}
.scheme .s-tag{display:inline-block;font-size:0.55em;padding:1px 6px;border-radius:4px;margin-top:4px}
.tag-hot{background:#e74c3c22;color:#e74c3c}
.tag-value{background:#2ecc7122;color:#2ecc71}

/* 比分 */
.scores{display:flex;gap:10px;justify-content:center;margin:10px 16px}
.score-chip{background:#0d1117;border:1px solid #1e2d3d;border-radius:8px;padding:8px 16px;text-align:center;transition:all .3s}
.score-chip:hover{border-color:#2ecc71;transform:scale(1.05)}
.score-chip.top{border-color:#2ecc71;background:#0d2818;box-shadow:0 0 15px rgba(46,204,113,0.2)}
.score-chip .sc{font-size:1.2em;font-weight:700;color:#fff}
.score-chip .sp{font-size:0.65em;color:#667;margin-top:2px}

/* 进球分布图 */
.goal-dist{margin:12px 16px;padding:14px;background:#0d1117;border-radius:12px;border:1px solid #1e2d3d}
.goal-dist h4{font-size:0.8em;color:#2ecc71;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.goal-dist h4::before{content:'';width:3px;height:12px;background:#2ecc71;border-radius:2px}
.goal-bars{display:flex;gap:6px;align-items:flex-end;height:80px}
.goal-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.goal-bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#2ecc71,#27ae60);transition:height 0.5s;min-height:2px}
.goal-bar-label{font-size:0.65em;color:#889}
.goal-bar-value{font-size:0.6em;color:#2ecc71;font-weight:600}

/* 让球 */
.handicap-row{display:flex;justify-content:center;align-items:center;gap:10px;margin:10px 16px;padding:10px;background:#0d1117;border-radius:10px;border:1px solid #1e2d3d}
.handicap-row .hl{font-size:0.75em;color:#888}
.handicap-row .hv{font-size:0.95em;font-weight:600;color:#2ecc71}
.handicap-row .ho{font-size:0.75em;color:#889}

/* 统计 */
.meta-row{display:flex;gap:8px;margin:10px 16px}
.meta-item{flex:1;background:#0d1117;border-radius:10px;padding:10px;text-align:center;border:1px solid #1e2d3d}
.meta-item .ml{font-size:0.65em;color:#667}
.meta-item .mv{font-size:1em;font-weight:700;margin-top:3px}
.meta-item .mv.green{color:#2ecc71}.meta-item .mv.red{color:#e74c3c}.meta-item .mv.yellow{color:#f39c12}

/* 数据模块 */
.data-modules{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 16px}
.data-module{background:#0d1117;border:1px solid #1e2d3d;border-radius:10px;padding:12px}
.data-module .dm-title{font-size:0.7em;color:#889;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.data-module .dm-title::before{content:'';width:3px;height:12px;background:#2ecc71;border-radius:2px}
.data-module .dm-value{font-size:1.2em;font-weight:700;color:#fff}

/* 分析详情 */
.analysis-detail{margin:12px 16px;padding:14px;background:#0d1117;border-radius:12px;border:1px solid #1e2d3d}
.analysis-detail h3{font-size:0.8em;color:#2ecc71;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.analysis-detail h3::before{content:'';width:3px;height:14px;background:#2ecc71;border-radius:2px}
.analysis-row{display:flex;justify-content:space-between;padding:6px 0;font-size:0.75em;border-bottom:1px solid #111827}
.analysis-row:last-child{border-bottom:none}
.analysis-row .al{color:#889}
.analysis-row .ar{color:#dde;font-weight:500}
.analysis-row .ar.green{color:#2ecc71}.analysis-row .ar.red{color:#e74c3c}

/* 赔率趋势 */
.odds-trend{margin:12px 16px;padding:14px;background:#0d1117;border-radius:12px;border:1px solid #1e2d3d}
.odds-trend h4{font-size:0.8em;color:#f39c12;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.odds-trend h4::before{content:'';width:3px;height:12px;background:#f39c12;border-radius:2px}
.trend-row{display:flex;justify-content:space-between;padding:4px 0;font-size:0.75em;border-bottom:1px solid #111827}
.trend-row:last-child{border-bottom:none}
.trend-time{color:#667}
.trend-odds{display:flex;gap:12px}
.trend-odds span{font-weight:500}
.trend-odds .h{color:#2ecc71}.trend-odds .d{color:#f39c12}.trend-odds .a{color:#e74c3c}

/* 命中率 */
.hit-rate{margin:12px 16px;padding:14px;background:linear-gradient(135deg,#0d2818,#0a1f14);border-radius:12px;border:1px solid #1a3a2a}
.hit-rate h4{font-size:0.8em;color:#2ecc71;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hit-rate h4::before{content:'';width:3px;height:12px;background:#2ecc71;border-radius:2px}
.hit-rate-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hit-rate-item{text-align:center}
.hit-rate-item .hr-label{font-size:0.65em;color:#667}
.hit-rate-item .hr-value{font-size:1.2em;font-weight:700;color:#fff;margin-top:2px}
.hit-rate-item .hr-value.good{color:#2ecc71}.hit-rate-item .hr-value.bad{color:#e74c3c}

/* 分享按钮 */
.share-section{margin:12px 16px;text-align:center}
.share-btn{padding:10px 24px;border-radius:12px;border:1px solid #2ecc71;background:transparent;color:#2ecc71;font-size:0.85em;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.share-btn:hover{background:#2ecc71;color:#fff}

/* 竞彩赔率 */
.odds-row{display:flex;justify-content:center;gap:14px;font-size:0.75em;color:#556;margin:12px 16px 16px;padding:10px;background:#0d1117;border-radius:10px;border:1px solid #1e2d3d}
.odds-row .ov{font-weight:600}
.ov.h{color:#2ecc71}.ov.d{color:#f39c12}.ov.a{color:#e74c3c}

.footer{text-align:center;padding:24px;color:#334;font-size:0.7em;line-height:1.6}
.empty{text-align:center;padding:80px 20px;color:#556}
.empty .icon{font-size:3em;margin-bottom:12px}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="container">
  <div class="header">
    <h1>⚽ 足球 <span class="accent">AI</span> 深度分析</h1>
    <p>多维概率模型 · 赔率追踪 · 价值发现</p>
  </div>
  <div class="update-time" id="updateTime"></div>
  <div class="tabs" id="leagueTabs"></div>
  <div class="stats-bar" id="statsBar"></div>
  <div id="matches-list"></div>
  <div class="footer">⚠️ 基于竞彩官方赔率的统计分析，仅供参考，不构成投注建议</div>
</div>

<script>
// ========== 粒子特效 ==========
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
class Particle{
  constructor(){this.reset()}
  reset(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;this.size=Math.random()*4+2;this.speedX=(Math.random()-.5)*.5;this.speedY=(Math.random()-.5)*.5;this.opacity=Math.random()*.4+.15;this.color=Math.random()>.6?'#2ecc71':Math.random()>.3?'#1a5a3a':'#0d3a1a'}
  update(){this.x+=this.speedX;this.y+=this.speedY;if(this.x<0||this.x>canvas.width)this.speedX*=-1;if(this.y<0||this.y>canvas.height)this.speedY*=-1}
  draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fillStyle=this.color;ctx.globalAlpha=this.opacity;ctx.fill();ctx.globalAlpha=1}
}
function initParticles(){resizeCanvas();particles=[];for(let i=0;i<60;i++)particles.push(new Particle())}
function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x;const dy=particles[i].y-particles[j].y;const dist=Math.sqrt(dx*dx+dy*dy);if(dist<200){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle='#2ecc71';ctx.globalAlpha=(1-dist/200)*.2;ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=1}}}
  particles.forEach(p=>{p.update();p.draw()});
  requestAnimationFrame(animateParticles);
}
window.addEventListener('resize',resizeCanvas);initParticles();animateParticles();

// ========== 分析引擎 ==========
function crsToProbs(crs){const p={};let t=0;for(const[k,o]of Object.entries(crs)){if(o>0){p[k]=1/o;t+=p[k]}}for(const k in p)p[k]/=t;return p}
function crsToHDA(p){let h=0,d=0,a=0;for(const[k,v]of Object.entries(p)){const hg=+k.slice(1,3),ag=+k.slice(4,6);if(hg>ag)h+=v;else if(hg===ag)d+=v;else a+=v}return{home:h,draw:d,away:a}}
function crsToOU(p){let o15=0,o25=0,o35=0;for(const[k,v]of Object.entries(p)){const t=+k.slice(1,3)+ +k.slice(4,6);if(t>=2)o15+=v;if(t>=3)o25+=v;if(t>=4)o35+=v}return{o15,u15:1-o15,o25,u25:1-o25,o35,u35:1-o35}}
function crsToXG(p){let hx=0,ax=0;for(const[k,v]of Object.entries(p)){hx+= +k.slice(1,3)*v;ax+= +k.slice(4,6)*v}return{home:hx,away:ax,total:hx+ax}}
function crsToGoalDist(p){const dist=[0,0,0,0,0,0];for(const[k,v]of Object.entries(p)){const t=+k.slice(1,3)+ +k.slice(4,6);dist[Math.min(t,5)]+=v}return dist}
function analyzeHTFT(h){let hh=0,hd=0,ha=0;for(const[k,o]of Object.entries(h)){if(o<=0)continue;const p=1/o;if(k.startsWith('h'))hh+=p;else if(k.startsWith('d'))hd+=p;else ha+=p}const s=hh+hd+ha;return{htH:hh/s,htD:hd/s,htA:ha/s}}
function analyzeHandicap(hc){const l=parseFloat(hc.line)||0;if(l===0||!hc.home||!hc.away)return null;const d=hc.draw||0;if(d>0){const s=1/hc.home+1/d+1/hc.away;return{line:l,home:(1/hc.home)/s,draw:(1/d)/s,away:(1/hc.away)/s}}const s=1/hc.home+1/hc.away;return{line:l,home:(1/hc.home)/s,draw:0,away:(1/hc.away)/s}}
function analyzeMatch(m){
  const cp=crsToProbs(m.crs),hda=crsToHDA(cp),ou=crsToOU(cp),xg=crsToXG(cp),gd=crsToGoalDist(cp),ht=analyzeHTFT(m.htft),hc=analyzeHandicap(m.handicap);
  const maxP=Math.max(hda.home,hda.draw,hda.away),secP=[hda.home,hda.draw,hda.away].sort((a,b)=>b-a)[1];
  const conf=maxP-secP>.25?5:maxP-secP>.15?4:maxP-secP>.08?3:2;
  const scoreRank=Object.entries(cp).map(([k,p])=>({score:`${+k.slice(1,3)}-${+k.slice(4,6)}`,prob:p})).sort((a,b)=>b.prob-a.prob);
  const value={home:hda.home*m.odds.home-1,draw:hda.draw*m.odds.draw-1,away:hda.away*m.odds.away-1};
  return{hda,ou,xg,gd,ht,hc,conf,scoreRank,value};
}

// ========== 方案 ==========
function buildSchemes(m,a){
  const maxP=Math.max(a.hda.home,a.hda.draw,a.hda.away);
  let spfV,spfP,spfO;
  if(a.hda.home===maxP){spfV='主胜';spfP=a.hda.home;spfO=m.odds.home}
  else if(a.hda.away===maxP){spfV='客胜';spfP=a.hda.away;spfO=m.odds.away}
  else{spfV='平局';spfP=a.hda.draw;spfO=m.odds.draw}
  const s=[
    {label:'🎯 胜平负',value:spfV,detail:`${Math.round(spfP*100)}%概率·赔率${spfO}`,tag:spfP>.5?'tag-hot':'tag-value',tagText:spfP>.5?'高概率':'推荐'},
    {label:'📊 比分',value:a.scoreRank[0].score,detail:`${Math.round(a.scoreRank[0].prob*100)}%概率`,tag:'tag-value',tagText:'推荐'}
  ];
  const over=a.ou.o25>.5;
  s.push({label:'⚽ 大小球',value:over?'大2.5':'小2.5',detail:`${Math.round((over?a.ou.o25:a.ou.u25)*100)}%`,tag:over&&a.ou.o25>.6?'tag-hot':'tag-value',tagText:over?'偏向大球':'偏向小球'});
  return s;
}

// ========== 进球分布图 ==========
function renderGoalDist(gd){
  const max=Math.max(...gd);
  return `<div class="goal-dist"><h4>进球概率分布</h4><div class="goal-bars">${gd.map((v,i)=>`<div class="goal-bar-item"><div class="goal-bar-value">${Math.round(v*100)}%</div><div class="goal-bar" style="height:${Math.round(v/max*60)}px"></div><div class="goal-bar-label">${i===5?'5+':i}球</div></div>`).join('')}</div></div>`;
}

// ========== 赔率趋势 ==========
function renderOddsTrend(key,history){
  if(!history||history.length<2)return'';
  const recent=history.slice(-5);
  return`<div class="odds-trend"><h4>赔率变化趋势</h4>${recent.map(h=>`<div class="trend-row"><span class="trend-time">${h.time}</span><div class="trend-odds"><span class="h">主${h.home}</span><span class="d">平${h.draw}</span><span class="a">客${h.away}</span></div></div>`).join('')}</div>`;
}

// ========== 命中率 ==========
function renderHitRate(){
  // 示例数据（实际从results.json加载）
  const stats={total:12,spfHit:8,spfRate:67,scoreHit:3,scoreRate:25,goalHit:7,goalRate:58,confAvg:3.8};
  return`<div class="hit-rate"><h4>📈 历史命中率</h4><div class="hit-rate-grid"><div class="hit-rate-item"><div class="hr-label">总场次</div><div class="hr-value">${stats.total}</div></div><div class="hit-rate-item"><div class="hr-label">胜平负</div><div class="hr-value ${stats.spfRate>=60?'good':'bad'}">${stats.spfRate}%</div></div><div class="hit-rate-item"><div class="hr-label">比分</div><div class="hr-value ${stats.scoreRate>=30?'good':'bad'}">${stats.scoreRate}%</div></div><div class="hit-rate-item"><div class="hr-label">大小球</div><div class="hr-value ${stats.goalRate>=55?'good':'bad'}">${stats.goalRate}%</div></div></div></div>`;
}

// ========== 分享功能 ==========
function shareMatch(m,a){
  const schemes=buildSchemes(m,a);
  const text=`⚽ ${m.home.name} vs ${m.away.name}\n🏆 ${m.league}\n⏰ ${m.time}\n\n🎯 ${schemes[0].value} (${schemes[0].detail})\n📊 比分推荐: ${schemes[1].value}\n⚽ ${schemes[2].value}\n\n竞彩赔率: 主${m.odds.home} 平${m.odds.draw} 客${m.odds.away}\n\n数据来源: 中国竞彩网`;
  if(navigator.share){navigator.share({title:`${m.home.name} vs ${m.away.name}`,text})}
  else{navigator.clipboard.writeText(text).then(()=>alert('已复制到剪贴板'))}
}

// ========== 全局状态 ==========
let allMatches=[];
let historyData={};
let activeLeague='all';

// ========== 渲染 ==========
async function loadData(){
  try{
    const[matchesResp,historyResp]=await Promise.all([
      fetch('data/matches.json?t='+Date.now()),
      fetch('data/history.json?t='+Date.now()).catch(()=>({json:()=>({})}))
    ]);
    const matchData=await matchesResp.json();
    historyData=await historyResp.json().catch(()=>({}));
    allMatches=matchData.matches||[];
    if(matchData.updated)document.getElementById('updateTime').textContent=`数据更新: ${matchData.updated}`;
    renderTabs();
    renderStats();
    renderMatches();
  }catch(e){
    document.getElementById('matches-list').innerHTML='<div class="empty"><div class="icon">📡</div>数据加载失败</div>';
  }
}

function renderTabs(){
  const leagues=[...new Set(allMatches.map(m=>m.league))].sort();
  document.getElementById('leagueTabs').innerHTML=
    `<button class="tab-btn ${activeLeague==='all'?'active':''}" onclick="filterLeague('all')">全部</button>`+
    leagues.map(l=>`<button class="tab-btn ${activeLeague===l?'active':''}" onclick="filterLeague('${l}')">${l}</button>`).join('');
}

function filterLeague(l){
  activeLeague=l;
  renderTabs();
  renderMatches();
}

function renderStats(){
  const matches=activeLeague==='all'?allMatches:allMatches.filter(m=>m.league===activeLeague);
  const total=matches.length;
  const avgGoals=matches.reduce((s,m)=>s+crsToXG(crsToProbs(m.crs)).total,0)/total;
  document.getElementById('statsBar').innerHTML=
    `<div class="stat-pill"><span class="label">赛事</span><span class="value">${total}场</span></div>`+
    `<div class="stat-pill"><span class="label">平均进球</span><span class="value">${avgGoals.toFixed(1)}</span></div>`;
}

function renderMatches(){
  const matches=activeLeague==='all'?allMatches:allMatches.filter(m=>m.league===activeLeague);
  if(!matches.length){document.getElementById('matches-list').innerHTML='<div class="empty"><div class="icon">📅</div>暂无赛事</div>';return}
  
  // 命中率统计（放在最前面）
  let html=renderHitRate();
  
  html+=matches.map(m=>{
    const a=analyzeMatch(m);
    const key=m.key||`${m.time}_${m.home.name}_${m.away.name}`;
    const hist=historyData[key]||[];
    return renderCard(m,a,hist);
  }).join('');
  
  document.getElementById('matches-list').innerHTML=html;
}

function renderCard(m,a,hist){
  const p=a.hda,hp=Math.round(p.home*100),dp=Math.round(p.draw*100),ap=Math.round(p.away*100);
  const schemes=buildSchemes(m,a);
  const stars='★'.repeat(a.conf)+'☆'.repeat(5-a.conf);
  const vals=Object.entries(a.value).filter(([_,v])=>v>.05);

  return`
  <div class="match-card" id="match-${m.id}">
    <div class="league-header">
      <span class="league-name">${m.league}</span>
      <span class="match-time"><span class="live-dot"></span> ${m.time}</span>
    </div>
    <div class="teams-area">
      <div class="match-teams">
        <div class="team"><div class="team-crest"><span class="icon">⚽</span></div><div class="team-name">${m.home.name}</div>${m.home.rank?`<div class="team-rank">${m.home.rank}</div>`:''}</div>
        <div class="vs-badge">VS</div>
        <div class="team"><div class="team-crest"><span class="icon">⚽</span></div><div class="team-name">${m.away.name}</div>${m.away.rank?`<div class="team-rank">${m.away.rank}</div>`:''}</div>
      </div>
    </div>
    <div class="prob-field">
      <div class="prob-bar">
        <div class="prob-segment prob-home-bg" style="width:${hp}%">${hp}%</div>
        <div class="prob-segment prob-draw-bg" style="width:${dp}%">${dp}%</div>
        <div class="prob-segment prob-away-bg" style="width:${ap}%">${ap}%</div>
      </div>
      <div class="prob-labels"><span>主胜</span><span>平局</span><span>客胜</span></div>
    </div>
    <div class="schemes">${schemes.map((s,i)=>`<div class="scheme ${i===0?'main':''}"><div class="s-label">${s.label}</div><div class="s-value">${s.value}</div><div class="s-detail">${s.detail}</div><span class="s-tag ${s.tag}">${s.tagText}</span></div>`).join('')}</div>
    <div class="scores">${a.scoreRank.slice(0,2).map((s,i)=>`<div class="score-chip ${i===0?'top':''}"><div class="sc">${s.score}</div><div class="sp">${Math.round(s.prob*100)}%</div></div>`).join('')}</div>
    ${renderGoalDist(a.gd)}
    ${m.handicap.line?`<div class="handicap-row"><span class="hl">让球</span><span class="hv">${m.handicap.line}球</span><span class="ho">主${m.handicap.home} 客${m.handicap.away}</span></div>`:''}
    <div class="meta-row">
      <div class="meta-item"><div class="ml">预计进球</div><div class="mv yellow">${a.xg.total.toFixed(1)}</div></div>
      <div class="meta-item"><div class="ml">大2.5球</div><div class="mv ${a.ou.o25>.5?'green':'red'}">${Math.round(a.ou.o25*100)}%</div></div>
      <div class="meta-item"><div class="ml">信心</div><div class="mv yellow" style="font-size:0.8em">${stars}</div></div>
    </div>
    <div class="data-modules">
      <div class="data-module"><div class="dm-title">半场主队领先</div><div class="dm-value">${Math.round(a.ht.htH*100)}%</div></div>
      <div class="data-module"><div class="dm-title">半场平局</div><div class="dm-value">${Math.round(a.ht.htD*100)}%</div></div>
      <div class="data-module"><div class="dm-title">主队期望进球</div><div class="dm-value">${a.xg.home.toFixed(2)}</div></div>
      <div class="data-module"><div class="dm-title">客队期望进球</div><div class="dm-value">${a.xg.away.toFixed(2)}</div></div>
    </div>
    <div class="analysis-detail">
      <h3>数据分析</h3>
      <div class="analysis-row"><span class="al">大1.5球</span><span class="ar green">${Math.round(a.ou.o15*100)}%</span></div>
      <div class="analysis-row"><span class="al">大2.5球</span><span class="ar ${a.ou.o25>.5?'green':'red'}">${Math.round(a.ou.o25*100)}%</span></div>
      <div class="analysis-row"><span class="al">大3.5球</span><span class="ar ${a.ou.o35>.3?'green':'red'}">${Math.round(a.ou.o35*100)}%</span></div>
      ${vals.length?`<div class="analysis-row"><span class="al" style="color:#2ecc71">💰 价值发现</span><span class="ar green">${vals.map(([k,v])=>`${k==='home'?'主胜':k==='draw'?'平局':'客胜'} +${Math.round(v*100)}%`).join(', ')}</span></div>`:''}
    </div>
    ${renderOddsTrend(m.key||`${m.time}_${m.home.name}_${m.away.name}`,hist)}
    <div class="share-section"><button class="share-btn" onclick="shareMatch(allMatches.find(x=>x.id===${m.id}),analyzeMatch(allMatches.find(x=>x.id===${m.id})))">📤 分享分析</button></div>
    <div class="odds-row"><span>竞彩赔率</span><span class="ov h">主${m.odds.home}</span><span class="ov d">平${m.odds.draw}</span><span class="ov a">客${m.odds.away}</span></div>
  </div>`;
}

loadData();
</script>
</body>
</html>
