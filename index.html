<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ 足球竞彩 AI 分析系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e17;color:#e0e0e0;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:16px}

/* 头部 */
.header{text-align:center;padding:24px 0 16px}
.header h1{font-size:1.8em;background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.header p{color:#666;font-size:0.9em}

/* Tab导航 */
.nav{display:flex;gap:4px;background:#111827;border-radius:12px;padding:4px;margin:16px 0;overflow-x:auto}
.nav-btn{flex:1;padding:10px 16px;border:none;background:transparent;color:#888;border-radius:8px;cursor:pointer;font-size:0.9em;transition:all .2s;white-space:nowrap}
.nav-btn.active{background:linear-gradient(135deg,#1a2a3a,#2a3a4a);color:#fff}

/* 面板 */
.panel{display:none}
.panel.active{display:block}

/* 赛事卡片 */
.match-card{background:linear-gradient(135deg,#111827,#1a2332);border-radius:16px;padding:20px;margin:12px 0;border:1px solid #1e2d3d;transition:all .2s}
.match-card:hover{border-color:#3a7bd5;box-shadow:0 4px 20px rgba(58,123,213,0.15)}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.match-league{font-size:0.8em;color:#666;background:#1a2332;padding:3px 10px;border-radius:12px}
.match-time{font-size:0.85em;color:#f39c12}
.match-teams{display:flex;align-items:center;justify-content:center;gap:20px;margin:16px 0}
.team{text-align:center;flex:1}
.team-name{font-size:1.1em;font-weight:bold;margin-top:8px}
.team-form{display:flex;gap:3px;justify-content:center;margin-top:6px}
.form-dot{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:0.7em;font-weight:bold;color:#fff}
.form-w{background:#2ecc71}.form-d{background:#f39c12}.form-l{background:#e74c3c}
.vs{font-size:1.5em;color:#444;font-weight:bold}
.team-logo{width:48px;height:48px;border-radius:50%;background:#1a2332;display:flex;align-items:center;justify-content:center;font-size:1.5em}

/* 分析结果 */
.analysis{background:#0d1117;border-radius:12px;padding:16px;margin-top:16px}
.analysis-title{font-size:0.9em;color:#3a7bd5;margin-bottom:12px;font-weight:bold}
.prob-bar{display:flex;height:32px;border-radius:8px;overflow:hidden;margin:8px 0}
.prob-home{background:linear-gradient(90deg,#2ecc71,#27ae60)}
.prob-draw{background:linear-gradient(90deg,#f39c12,#e67e22)}
.prob-away{background:linear-gradient(90deg,#e74c3c,#c0392b)}
.prob-labels{display:flex;justify-content:space-between;font-size:0.8em;color:#888;margin-top:4px}
.prob-value{text-align:center;line-height:32px;font-weight:bold;font-size:0.85em;color:#fff}

/* 比分推荐 */
.score-recs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.score-chip{background:#1a2332;border:1px solid #2a3a4a;border-radius:8px;padding:8px 16px;text-align:center}
.score-chip .score{font-size:1.2em;font-weight:bold;color:#fff}
.score-chip .prob{font-size:0.75em;color:#888;margin-top:2px}

/* 信心指数 */
.confidence{display:flex;align-items:center;gap:4px;margin:12px 0}
.star{font-size:1.2em}
.star.on{color:#f39c12}.star.off{color:#333}

/* 进球预测 */
.goal-pred{display:flex;gap:12px;margin:12px 0}
.goal-card{flex:1;background:#1a2332;border-radius:8px;padding:12px;text-align:center}
.goal-card .label{font-size:0.8em;color:#888}
.goal-card .value{font-size:1.3em;font-weight:bold;margin-top:4px}
.goal-card .value.over{color:#2ecc71}.goal-card .value.under{color:#e74c3c}

/* 竞彩数据表 */
.odds-table{width:100%;border-collapse:collapse;font-size:0.85em;margin:12px 0}
.odds-table th{background:#1a2332;color:#888;padding:10px 8px;text-align:center;font-weight:normal;border-bottom:1px solid #2a3a4a}
.odds-table td{padding:10px 8px;text-align:center;border-bottom:1px solid #111827}
.odds-table tr:hover{background:#111827}
.odds-val{font-weight:bold}
.odds-val.high{color:#2ecc71}
.odds-val.mid{color:#f39c12}
.odds-val.low{color:#e74c3c}

/* 筛选器 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.filter-btn{padding:6px 14px;border-radius:16px;border:1px solid #2a3a4a;background:transparent;color:#888;cursor:pointer;font-size:0.8em;transition:all .2s}
.filter-btn.active{background:#3a7bd5;color:#fff;border-color:#3a7bd5}

/* 统计图表 */
.chart-container{background:#111827;border-radius:12px;padding:16px;margin:12px 0}
.chart-bar{display:flex;align-items:center;gap:8px;margin:6px 0}
.chart-bar .label{width:60px;text-align:right;font-size:0.85em;color:#888}
.chart-bar .bar{flex:1;height:24px;background:#1a2332;border-radius:6px;overflow:hidden}
.chart-bar .fill{height:100%;border-radius:6px;transition:width 0.5s}
.chart-bar .fill.green{background:linear-gradient(90deg,#2ecc71,#27ae60)}
.chart-bar .fill.red{background:linear-gradient(90deg,#e74c3c,#c0392b)}
.chart-bar .fill.blue{background:linear-gradient(90deg,#3498db,#2980b9)}
.chart-bar .val{width:40px;font-size:0.8em;color:#666}

/* 加载状态 */
.loading{text-align:center;padding:40px;color:#666}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid #333;border-top-color:#3a7bd5;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 响应式 */
@media(max-width:768px){
  .match-teams{gap:12px}
  .team-logo{width:36px;height:36px;font-size:1.2em}
  .team-name{font-size:0.95em}
  .score-recs{gap:6px}
  .score-chip{padding:6px 12px}
  .nav-btn{padding:8px 12px;font-size:0.8em}
}

/* 底部 */
.footer{text-align:center;padding:24px;color:#444;font-size:0.75em}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>⚽ 足球竞彩 AI 分析系统</h1>
    <p>多维数据驱动 · 智能预测 · 同步竞彩</p>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="showPanel('today')">📅 今日赛事</button>
    <button class="nav-btn" onclick="showPanel('hot')">🔥 热门推荐</button>
    <button class="nav-btn" onclick="showPanel('analyze')">📊 深度分析</button>
    <button class="nav-btn" onclick="showPanel('history')">📋 历史数据</button>
  </div>

  <!-- 今日赛事 -->
  <div class="panel active" id="panel-today">
    <div class="filters">
      <button class="filter-btn active" onclick="filterLeague('all')">全部</button>
      <button class="filter-btn" onclick="filterLeague('wc')">世界杯</button>
      <button class="filter-btn" onclick="filterLeague('epl')">英超</button>
      <button class="filter-btn" onclick="filterLeague('laliga')">西甲</button>
      <button class="filter-btn" onclick="filterLeague('seriea')">意甲</button>
      <button class="filter-btn" onclick="filterLeague('bundes')">德甲</button>
      <button class="filter-btn" onclick="filterLeague('ucl')">欧冠</button>
      <button class="filter-btn" onclick="filterLeague('csl')">中超</button>
    </div>
    <div id="matches-list">
      <div class="loading"><div class="spinner"></div><p style="margin-top:12px">正在加载赛事数据...</p></div>
    </div>
  </div>

  <!-- 热门推荐 -->
  <div class="panel" id="panel-hot">
    <div id="hot-list">
      <div class="loading"><div class="spinner"></div><p style="margin-top:12px">正在分析热门赛事...</p></div>
    </div>
  </div>

  <!-- 深度分析 -->
  <div class="panel" id="panel-analyze">
    <div id="analyze-content">
      <div class="loading"><div class="spinner"></div><p style="margin-top:12px">请选择赛事进行深度分析</p></div>
    </div>
  </div>

  <!-- 历史数据 -->
  <div class="panel" id="panel-history">
    <div id="history-content">
      <div class="loading"><div class="spinner"></div><p style="margin-top:12px">正在加载历史数据...</p></div>
    </div>
  </div>

  <div class="footer">
    ⚠️ 本系统仅供参考，不构成任何投注建议。竞彩有风险，投注需谨慎。
  </div>
</div>

<script>
// ========== 数据层 ==========
const API_BASE = 'https://api.football-data.org/v4';
const API_KEY = ''; // 免费tier不需要key

// 竞彩赛事数据（示例数据，实际由GitHub Actions更新）
let matchData = [];
let analysisCache = {};

// 获取赛事数据
async function loadMatchData() {
  try {
    const resp = await fetch('data/matches.json?t=' + Date.now());
    const data = await resp.json();
    matchData = data.matches || [];
    renderMatches(matchData);
    renderHotMatches();
  } catch(e) {
    console.error('加载失败，使用示例数据:', e);
    useExampleData();
  }
}

// 示例数据（API不可用时的降级方案）
function useExampleData() {
  matchData = [
    {
      id: 1, league: '世界杯', leagueKey: 'wc',
      time: '2026-07-30 01:00', status: 'upcoming',
      home: {name: '挪威', logo: '🇳🇴', form: ['W','W','D','L','W'], rank: 42, goalsFor: 1.8, goalsAgainst: 0.9},
      away: {name: '科特迪瓦', logo: '🇨🇮', form: ['W','D','W','W','L'], rank: 38, goalsFor: 1.3, goalsAgainst: 1.1},
      odds: {home: 2.15, draw: 3.20, away: 3.50}
    },
    {
      id: 2, league: '世界杯', leagueKey: 'wc',
      time: '2026-07-30 05:00', status: 'upcoming',
      home: {name: '瑞典', logo: '🇸🇪', form: ['D','W','L','W','W'], rank: 25, goalsFor: 1.5, goalsAgainst: 0.7},
      away: {name: '法国', logo: '🇫🇷', form: ['W','W','W','D','W'], rank: 2, goalsFor: 2.3, goalsAgainst: 0.6},
      odds: {home: 4.50, draw: 3.60, away: 1.75}
    },
    {
      id: 3, league: '世界杯', leagueKey: 'wc',
      time: '2026-07-30 09:00', status: 'upcoming',
      home: {name: '厄瓜多尔', logo: '🇪🇨', form: ['W','L','D','W','L'], rank: 35, goalsFor: 1.3, goalsAgainst: 1.1},
      away: {name: '墨西哥', logo: '🇲🇽', form: ['W','W','D','W','W'], rank: 12, goalsFor: 1.8, goalsAgainst: 0.6},
      odds: {home: 3.20, draw: 3.10, away: 2.30}
    },
    {
      id: 4, league: '英超', leagueKey: 'epl',
      time: '2026-08-16 22:00', status: 'upcoming',
      home: {name: '曼城', logo: '🔵', form: ['W','W','W','D','W'], rank: 1, goalsFor: 2.8, goalsAgainst: 0.5},
      away: {name: '利物浦', logo: '🔴', form: ['W','W','D','W','W'], rank: 2, goalsFor: 2.5, goalsAgainst: 0.7},
      odds: {home: 1.90, draw: 3.50, away: 4.00}
    },
    {
      id: 5, league: '西甲', leagueKey: 'laliga',
      time: '2026-08-17 03:00', status: 'upcoming',
      home: {name: '皇马', logo: '⚪', form: ['W','W','W','W','D'], rank: 1, goalsFor: 2.6, goalsAgainst: 0.6},
      away: {name: '巴萨', logo: '🔵🔴', form: ['W','D','W','W','W'], rank: 2, goalsFor: 2.4, goalsAgainst: 0.8},
      odds: {home: 2.10, draw: 3.30, away: 3.40}
    }
  ];
  renderMatches(matchData);
  renderHotMatches();
}

// ========== 分析引擎 ==========
function analyzeMatch(match) {
  const h = match.home, a = match.away;

  // 1. 近期状态评分
  const formScore = (team) => {
    const pts = team.form.reduce((s, r) => s + (r==='W'?3:r==='D'?1:0), 0);
    return pts / (team.form.length * 3) * 100;
  };
  const hForm = formScore(h), aForm = formScore(a);

  // 2. 攻防评分
  const attackScore = (team) => Math.min(team.goalsFor / 3 * 100, 100);
  const defenseScore = (team) => Math.max(100 - team.goalsAgainst / 2 * 100, 0);
  const hAttack = attackScore(h), aAttack = attackScore(a);
  const hDefense = defenseScore(h), aDefense = defenseScore(a);

  // 3. 排名评分
  const rankScore = (team) => Math.max(100 - team.rank * 1.5, 10);
  const hRank = rankScore(h), aRank = rankScore(a);

  // 4. 综合评分
  const hTotal = hForm * 0.25 + hAttack * 0.2 + hDefense * 0.2 + hRank * 0.15 + (match.odds.away / (match.odds.home + match.odds.draw + match.odds.away)) * 100 * 0.2;
  const aTotal = aForm * 0.25 + aAttack * 0.2 + aDefense * 0.2 + aRank * 0.15 + (match.odds.home / (match.odds.home + match.odds.draw + match.odds.away)) * 100 * 0.2;

  // 5. 胜平负概率
  const totalStr = hTotal + aTotal;
  let homeProb = (hTotal / totalStr * 70 + (1/match.odds.home) / (1/match.odds.home + 1/match.odds.draw + 1/match.odds.away) * 30);
  let awayProb = (aTotal / totalStr * 70 + (1/match.odds.away) / (1/match.odds.home + 1/match.odds.draw + 1/match.odds.away) * 30);
  let drawProb = 1 - homeProb - awayProb;

  // 归一化
  const probSum = homeProb + drawProb + awayProb;
  homeProb /= probSum; drawProb /= probSum; awayProb /= probSum;

  // 6. 比分推荐
  const avgGoals = (h.goalsFor + a.goalsAgainst) / 2;
  const avgConceded = (a.goalsFor + h.goalsAgainst) / 2;
  const scores = [];
  for (let hg = 0; hg <= 4; hg++) {
    for (let ag = 0; ag <= 4; ag++) {
      const p = poissonProb(hg, avgGoals) * poissonProb(ag, avgConceded);
      scores.push({score: `${hg}-${ag}`, prob: p, home: hg, away: ag});
    }
  }
  scores.sort((a, b) => b.prob - a.prob);
  const topScores = scores.slice(0, 5);

  // 7. 大小球
  const totalGoals = avgGoals + avgConceded;
  const overProb = totalGoals > 2.5 ? 0.6 + (totalGoals - 2.5) * 0.1 : 0.4 - (2.5 - totalGoals) * 0.1;

  // 8. 信心指数
  const confidence = Math.min(Math.abs(homeProb - awayProb) * 5 + 2, 5);

  return {
    homeProb: Math.round(homeProb * 100),
    drawProb: Math.round(drawProb * 100),
    awayProb: Math.round(awayProb * 100),
    topScores,
    totalGoals: totalGoals.toFixed(1),
    overProb: Math.round(overProb * 100),
    confidence: Math.round(confidence),
    hForm: Math.round(hForm), aForm: Math.round(aForm),
    hAttack: Math.round(hAttack), aAttack: Math.round(aAttack),
    hDefense: Math.round(hDefense), aDefense: Math.round(aDefense),
  };
}

// 泊松分布概率
function poissonProb(k, lambda) {
  return Math.pow(lambda, k) * Math.exp(-lambda) / factorial(k);
}
function factorial(n) {
  if (n <= 1) return 1;
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

// ========== 渲染 ==========
function renderMatches(matches) {
  const container = document.getElementById('matches-list');
  if (!matches.length) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#666">暂无赛事数据</div>';
    return;
  }

  container.innerHTML = matches.map(m => {
    const analysis = analyzeMatch(m);
    return renderMatchCard(m, analysis);
  }).join('');
}

function renderMatchCard(m, a) {
  const formDots = (form) => form.map(f =>
    `<span class="form-dot ${f==='W'?'form-w':f==='D'?'form-d':'form-l'}">${f}</span>`
  ).join('');

  const stars = Array.from({length: 5}, (_, i) =>
    `<span class="star ${i < a.confidence ? 'on' : 'off'}">★</span>`
  ).join('');

  return `
  <div class="match-card" onclick="showDeepAnalysis(${m.id})">
    <div class="match-header">
      <span class="match-league">${m.league}</span>
      <span class="match-time">${m.time}</span>
    </div>
    <div class="match-teams">
      <div class="team">
        <div class="team-logo">${m.home.logo}</div>
        <div class="team-name">${m.home.name}</div>
        <div class="team-form">${formDots(m.home.form)}</div>
      </div>
      <div class="vs">VS</div>
      <div class="team">
        <div class="team-logo">${m.away.logo}</div>
        <div class="team-name">${m.away.name}</div>
        <div class="team-form">${formDots(m.away.form)}</div>
      </div>
    </div>

    <div class="analysis">
      <div class="analysis-title">📊 AI 分析结果</div>

      <div class="prob-bar">
        <div class="prob-home prob-home" style="width:${a.homeProb}%">
          <span class="prob-value">${a.homeProb}%</span>
        </div>
        <div class="prob-draw" style="width:${a.drawProb}%">
          <span class="prob-value">${a.drawProb}%</span>
        </div>
        <div class="prob-away" style="width:${a.awayProb}%">
          <span class="prob-value">${a.awayProb}%</span>
        </div>
      </div>
      <div class="prob-labels">
        <span>主胜 ${m.home.name}</span>
        <span>平局</span>
        <span>客胜 ${m.away.name}</span>
      </div>

      <div class="score-recs">
        ${a.topScores.slice(0, 4).map(s => `
          <div class="score-chip">
            <div class="score">${s.score}</div>
            <div class="prob">${Math.round(s.prob*100)}%</div>
          </div>
        `).join('')}
      </div>

      <div class="goal-pred">
        <div class="goal-card">
          <div class="label">预计总进球</div>
          <div class="value">${a.totalGoals}</div>
        </div>
        <div class="goal-card">
          <div class="label">大2.5球</div>
          <div class="value ${a.overProb > 50 ? 'over' : 'under'}">${a.overProb}%</div>
        </div>
        <div class="goal-card">
          <div class="label">信心指数</div>
          <div class="confidence">${stars}</div>
        </div>
      </div>

      <div class="chart-container" style="margin-top:12px">
        <div class="chart-bar">
          <span class="label">状态</span>
          <div class="bar"><div class="fill green" style="width:${a.hForm}%"></div></div>
          <span class="val">${a.hForm}%</span>
          <span class="val">${a.aForm}%</span>
          <div class="bar"><div class="fill blue" style="width:${a.aForm}%"></div></div>
          <span class="label" style="text-align:left">${m.away.name}</span>
        </div>
        <div class="chart-bar">
          <span class="label">进攻</span>
          <div class="bar"><div class="fill green" style="width:${a.hAttack}%"></div></div>
          <span class="val">${a.hAttack}%</span>
          <span class="val">${a.aAttack}%</span>
          <div class="bar"><div class="fill blue" style="width:${a.aAttack}%"></div></div>
          <span class="label" style="text-align:left">${m.away.name}</span>
        </div>
        <div class="chart-bar">
          <span class="label">防守</span>
          <div class="bar"><div class="fill green" style="width:${a.hDefense}%"></div></div>
          <span class="val">${a.hDefense}%</span>
          <span class="val">${a.aDefense}%</span>
          <div class="bar"><div class="fill blue" style="width:${a.aDefense}%"></div></div>
          <span class="label" style="text-align:left">${m.away.name}</span>
        </div>
      </div>
    </div>

    <div style="margin-top:12px;display:flex;gap:8px">
      <span style="font-size:0.8em;color:#666">竞彩赔率:</span>
      <span class="odds-val high">${m.odds.home}</span>
      <span style="color:#444">|</span>
      <span class="odds-val mid">${m.odds.draw}</span>
      <span style="color:#444">|</span>
      <span class="odds-val low">${m.odds.away}</span>
    </div>
  </div>`;
}

function renderHotMatches() {
  const hot = matchData.filter(m => {
    const a = analyzeMatch(m);
    return a.confidence >= 3;
  }).sort((a, b) => analyzeMatch(b).confidence - analyzeMatch(a).confidence);

  const container = document.getElementById('hot-list');
  if (!hot.length) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#666">暂无高信心推荐</div>';
    return;
  }

  container.innerHTML = `
    <div style="margin-bottom:16px;color:#f39c12;font-size:0.9em">
      ⭐ 以下为信心指数≥3星的推荐赛事
    </div>
    ${hot.map(m => renderMatchCard(m, analyzeMatch(m))).join('')}
  `;
}

// ========== 深度分析 ==========
function showDeepAnalysis(matchId) {
  const match = matchData.find(m => m.id === matchId);
  if (!match) return;

  showPanel('analyze');
  const a = analyzeMatch(match);
  const container = document.getElementById('analyze-content');

  container.innerHTML = `
    <div class="match-card" style="cursor:default">
      <h2 style="text-align:center;margin-bottom:16px">${match.home.name} vs ${match.away.name}</h2>
      <p style="text-align:center;color:#888">${match.league} · ${match.time}</p>

      <div class="analysis" style="margin-top:20px">
        <div class="analysis-title">🔬 全维度分析</div>

        <table class="odds-table">
          <tr><th>指标</th><th>${match.home.name}</th><th>对比</th><th>${match.away.name}</th></tr>
          <tr><td>FIFA排名</td><td>${match.home.rank}</td><td>vs</td><td>${match.away.rank}</td></tr>
          <tr><td>近期状态</td><td>${a.hForm}%</td><td>vs</td><td>${a.aForm}%</td></tr>
          <tr><td>进攻评分</td><td>${a.hAttack}%</td><td>vs</td><td>${a.aAttack}%</td></tr>
          <tr><td>防守评分</td><td>${a.hDefense}%</td><td>vs</td><td>${a.aDefense}%</td></tr>
          <tr><td>场均进球</td><td>${match.home.goalsFor}</td><td>vs</td><td>${match.away.goalsFor}</td></tr>
          <tr><td>场均失球</td><td>${match.home.goalsAgainst}</td><td>vs</td><td>${match.away.goalsAgainst}</td></tr>
          <tr><td>近5场</td><td>${match.home.form.join(' ')}</td><td></td><td>${match.away.form.join(' ')}</td></tr>
        </table>
      </div>

      <div class="analysis" style="margin-top:16px">
        <div class="analysis-title">🎯 推荐方案</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
          <div class="goal-card">
            <div class="label">胜平负推荐</div>
            <div class="value" style="color:#fff;font-size:1.1em">
              ${a.homeProb > a.awayProb ? '主胜' : a.awayProb > a.homeProb ? '客胜' : '平局'}
              (${Math.max(a.homeProb, a.drawProb, a.awayProb)}%)
            </div>
          </div>
          <div class="goal-card">
            <div class="label">比分推荐</div>
            <div class="value" style="color:#fff;font-size:1.1em">${a.topScores[0].score}</div>
          </div>
          <div class="goal-card">
            <div class="label">大小球</div>
            <div class="value ${a.overProb > 50 ? 'over' : 'under'}">
              ${a.overProb > 50 ? '大2.5' : '小2.5'} (${a.overProb}%)
            </div>
          </div>
          <div class="goal-card">
            <div class="label">信心指数</div>
            <div style="font-size:1.5em;color:#f39c12">${'★'.repeat(a.confidence)}${'☆'.repeat(5-a.confidence)}</div>
          </div>
        </div>
      </div>

      <div class="analysis" style="margin-top:16px">
        <div class="analysis-title">📈 竞彩赔率对比</div>
        <table class="odds-table">
          <tr><th>项目</th><th>赔率</th><th>隐含概率</th><th>AI概率</th><th>偏差</th></tr>
          <tr>
            <td>主胜</td>
            <td class="odds-val">${match.odds.home}</td>
            <td>${Math.round(1/match.odds.home*100)}%</td>
            <td>${a.homeProb}%</td>
            <td style="color:${Math.abs(a.homeProb - 1/match.odds.home*100) > 5 ? '#e74c3c' : '#2ecc71'}">
              ${Math.round(a.homeProb - 1/match.odds.home*100)}%
            </td>
          </tr>
          <tr>
            <td>平局</td>
            <td class="odds-val">${match.odds.draw}</td>
            <td>${Math.round(1/match.odds.draw*100)}%</td>
            <td>${a.drawProb}%</td>
            <td style="color:${Math.abs(a.drawProb - 1/match.odds.draw*100) > 5 ? '#e74c3c' : '#2ecc71'}">
              ${Math.round(a.drawProb - 1/match.odds.draw*100)}%
            </td>
          </tr>
          <tr>
            <td>客胜</td>
            <td class="odds-val">${match.odds.away}</td>
            <td>${Math.round(1/match.odds.away*100)}%</td>
            <td>${a.awayProb}%</td>
            <td style="color:${Math.abs(a.awayProb - 1/match.odds.away*100) > 5 ? '#e74c3c' : '#2ecc71'}">
              ${Math.round(a.awayProb - 1/match.odds.away*100)}%
            </td>
          </tr>
        </table>
        <p style="font-size:0.75em;color:#666;margin-top:8px">
          💡 偏差>5%表示AI分析与市场预期存在分歧，可能有价值
        </p>
      </div>
    </div>
  `;
}

// ========== UI控制 ==========
function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  event.target.classList.add('active');
}

function filterLeague(key) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (key === 'all') {
    renderMatches(matchData);
  } else {
    renderMatches(matchData.filter(m => m.leagueKey === key));
  }
}

// 初始化
loadMatchData();
</script>
</body>
</html>
